```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تصميم الدعوات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f6f3;
    color: #222;
}

.container {
    max-width: 850px;
    margin: 40px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

h1 {
    text-align: center;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
}

.section {
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #eee;
}

.section:first-of-type {
    border-top: 0;
    padding-top: 0;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="file"],
input[type="number"],
input[type="text"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #888;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: #222;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.hint {
    color: #888;
    font-size: 13px;
    line-height: 1.7;
    margin-top: 8px;
}


/* =========================
   منطقة التصميم
========================= */

.canvas-wrapper {
    margin-top: 20px;
    background: #eee;
    border-radius: 15px;
    padding: 15px;
    overflow: auto;
    text-align: center;
}

#designCanvas {
    position: relative;
    display: inline-block;
    max-width: 100%;
    user-select: none;
}

#designImage {
    display: block;
    max-width: 100%;
    height: auto;
}


/* =========================
   العناصر القابلة للسحب
========================= */

.draggable {
    position: absolute;
    cursor: move;
    border: 2px dashed rgba(0,0,0,0.5);
    background: rgba(255,255,255,0.65);
    padding: 6px 10px;
    z-index: 5;
    user-select: none;
}

#nameElement {
    font-size: 22px;
    font-weight: bold;
}

#qrElement {
    width: 110px;
    height: 110px;
    padding: 5px;
}

#qrElement img {
    width: 100%;
    height: 100%;
    display: block;
}

.selected {
    border-color: #222;
}


/* =========================
   التحكم
========================= */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.control-box {
    background: #faf9f7;
    padding: 15px;
    border-radius: 12px;
}

.control-box label {
    font-size: 13px;
    margin-bottom: 7px;
}

.preview-box {
    background: #faf9f7;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

.preview-name {
    font-size: 20px;
    font-weight: bold;
}

.message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
}

.success {
    color: #287a4b;
}

.error {
    color: #c0392b;
}


@media (max-width: 600px) {

    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .box {
        padding: 20px;
    }

    .controls {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<h1>
تصميم الدعوات
</h1>


<div class="subtitle">

ارفعي تصميمك وحددي مكان الاسم والـ QR مرة واحدة

</div>


<!-- =========================
     رفع التصميم
========================= -->

<div class="section">

<label>
تصميم الدعوة
</label>


<input
    id="designFile"
    type="file"
    accept="image/png,image/jpeg,image/webp"
>


<div class="hint">

يمكنك رفع تصميم PNG أو JPG أو WEBP.

</div>

</div>


<!-- =========================
     مساحة التصميم
========================= -->

<div
    id="canvasWrapper"
    class="canvas-wrapper"
    style="display:none;">

<div id="designCanvas">

<img
    id="designImage"
    draggable="false"
>


<div
    id="nameElement"
    class="draggable">

اسم المدعو

</div>


<div
    id="qrElement"
    class="draggable">

<img
    id="qrImage"
    alt="QR"
>

</div>

</div>

</div>


<!-- =========================
     التحكم
========================= -->

<div
    id="controlsSection"
    class="section"
    style="display:none;">

<h3>
تحكم بالعناصر
</h3>


<div class="controls">


<div class="control-box">

<label>
حجم الاسم
</label>

<input
    id="nameSize"
    type="number"
    min="8"
    max="100"
    value="22"
>


<button
    id="applyNameSize"
    type="button">

تطبيق حجم الاسم

</button>

</div>


<div class="control-box">

<label>
حجم QR
</label>

<input
    id="qrSize"
    type="number"
    min="50"
    max="500"
    value="110"
>


<button
    id="applyQrSize"
    type="button">

تطبيق حجم QR

</button>

</div>

</div>


<div class="hint">

اسحبي "اسم المدعو" و QR بالماوس إلى المكان المناسب داخل التصميم.

</div>

</div>


<!-- =========================
     المعاينة
========================= -->

<div
    id="previewSection"
    class="section"
    style="display:none;">

<h3>
معاينة الدعوة
</h3>


<div class="preview-box">

<div
    id="previewName"
    class="preview-name">

سارة محمد

</div>

<div class="hint">

هذه مجرد معاينة لمكان الاسم.

</div>

</div>

</div>


<!-- =========================
     الأزرار
========================= -->

<div
    id="buttonsSection"
    style="display:none;">

<button
    id="saveButton"
    type="button">

حفظ أماكن الاسم والـ QR

</button>


<button
    id="continueButton"
    type="button">

الانتقال إلى توليد الدعوات

</button>

</div>


<div
    id="message"
    class="message">

</div>


</div>

</div>


<script>


/* =========================
   المتغيرات
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    params.get("event_id");


let designData = {

    image:
        null,

    nameX:
        0.5,

    nameY:
        0.5,

    qrX:
        0.75,

    qrY:
        0.75,

    nameSize:
        22,

    qrSize:
        110

};


let activeElement =
    null;


let dragging =
    false;


let offsetX =
    0;


let offsetY =
    0;


/* =========================
   التحقق
========================= */

if (!eventId) {

    showMessage(
        "رابط الحفل غير صحيح.",
        "error"
    );

}


/* =========================
   رفع التصميم
========================= */

document
    .getElementById(
        "designFile"
    )
    .addEventListener(
        "change",
        loadDesign
    );


function loadDesign(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    if (
        !file.type.startsWith(
            "image/"
        )
    ) {

        showMessage(
            "اختاري صورة تصميم صحيحة.",
            "error"
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            const image =
                document.getElementById(
                    "designImage"
                );


            image.src =
                e.target.result;


            image.onload =
                function() {

                    document.getElementById(
                        "canvasWrapper"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "controlsSection"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "previewSection"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "buttonsSection"
                    ).style.display =
                        "block";


                    designData.image =
                        e.target.result;


                    positionElements();

                };

        };


    reader.readAsDataURL(file);

}


/* =========================
   وضع العناصر
========================= */

function positionElements() {

    const canvas =
        document.getElementById(
            "designCanvas"
        );


    const name =
        document.getElementById(
            "nameElement"
        );


    const qr =
        document.getElementById(
            "qrElement"
        );


    name.style.left =
        (
            designData.nameX *
            canvas.clientWidth
        ) + "px";


    name.style.top =
        (
            designData.nameY *
            canvas.clientHeight
        ) + "px";


    qr.style.left =
        (
            designData.qrX *
            canvas.clientWidth
        ) + "px";


    qr.style.top =
        (
            designData.qrY *
            canvas.clientHeight
        ) + "px";

}


/* =========================
   إنشاء QR تجريبي
========================= */

document.getElementById(
    "qrImage"
).src =
    createDemoQR();


function createDemoQR() {

    return `
        https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=DEMO
    `;

}


/* =========================
   السحب
========================= */

document
    .getElementById(
        "nameElement"
    )
    .addEventListener(
        "mousedown",
        startDrag
    );


document
    .getElementById(
        "qrElement"
    )
    .addEventListener(
        "mousedown",
        startDrag
    );


document.addEventListener(
    "mousemove",
    drag
);


document.addEventListener(
    "mouseup",
    stopDrag
);


function startDrag(event) {

    activeElement =
        event.currentTarget;


    dragging =
        true;


    const rect =
        activeElement.getBoundingClientRect();


    offsetX =
        event.clientX -
        rect.left;


    offsetY =
        event.clientY -
        rect.top;


    activeElement.classList.add(
        "selected"
    );

}


function drag(event) {

    if (
        !dragging ||
        !activeElement
    ) return;


    const canvas =
        document.getElementById(
            "designCanvas"
        );


    const canvasRect =
        canvas.getBoundingClientRect();


    let x =
        event.clientX -
        canvasRect.left -
        offsetX;


    let y =
        event.clientY -
        canvasRect.top -
        offsetY;


    x =
        Math.max(
            0,
            Math.min(
                x,
                canvas.clientWidth -
                activeElement.offsetWidth
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                y,
                canvas.clientHeight -
                activeElement.offsetHeight
            )
        );


    activeElement.style.left =
        x + "px";


    activeElement.style.top =
        y + "px";


    if (
        activeElement.id ===
        "nameElement"
    ) {

        designData.nameX =
            x /
            canvas.clientWidth;


        designData.nameY =
            y /
            canvas.clientHeight;

    }


    if (
        activeElement.id ===
        "qrElement"
    ) {

        designData.qrX =
            x /
            canvas.clientWidth;


        designData.qrY =
            y /
            canvas.clientHeight;

    }

}


function stopDrag() {

    if (activeElement) {

        activeElement.classList.remove(
            "selected"
        );

    }


    dragging =
        false;


    activeElement =
        null;

}


/* =========================
   حجم الاسم
========================= */

document
    .getElementById(
        "applyNameSize"
    )
    .addEventListener(
        "click",
        function() {

            const size =
                Number(
                    document
                        .getElementById(
                            "nameSize"
                        )
                        .value
                );


            if (
                size < 8 ||
                size > 100
            ) return;


            designData.nameSize =
                size;


            document
                .getElementById(
                    "nameElement"
                )
                .style.fontSize =
                size + "px";

        }
    );


/* =========================
   حجم QR
========================= */

document
    .getElementById(
        "applyQrSize"
    )
    .addEventListener(
        "click",
        function() {

            const size =
                Number(
                    document
                        .getElementById(
                            "qrSize"
                        )
                        .value
                );


            if (
                size < 50 ||
                size > 500
            ) return;


            designData.qrSize =
                size;


            const qr =
                document.getElementById(
                    "qrElement"
                );


            qr.style.width =
                size + "px";


            qr.style.height =
                size + "px";

        }
    );


/* =========================
   حفظ الإعدادات
========================= */

document
    .getElementById(
        "saveButton"
    )
    .addEventListener(
        "click",
        saveDesign
    );


async function saveDesign() {

    if (!designData.image) {

        showMessage(
            "ارفعي التصميم أولًا.",
            "error"
        );

        return;
    }


    localStorage.setItem(

        `invitation_design_${eventId}`,

        JSON.stringify(
            designData
        )

    );


    showMessage(
        "تم حفظ أماكن الاسم والـ QR بنجاح 🤍",
        "success"
    );

}


/* =========================
   الانتقال للتوليد
========================= */

document
    .getElementById(
        "continueButton"
    )
    .addEventListener(
        "click",
        async function() {

            await saveDesign();


            window.location.href =
                `generate.html?event_id=${encodeURIComponent(eventId)}`;

        }
    );


/* =========================
   الرسائل
========================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        `message ${type}`;

}

</script>

</body>

</html>
```
