<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تصميم الدعوات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f6f3;
    color: #222;
}

.container {
    max-width: 850px;
    margin: 40px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
}

.section {
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #eee;
}

.section:first-of-type {
    border-top: 0;
    padding-top: 0;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="file"],
input[type="number"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #888;
}

.hint {
    color: #888;
    font-size: 13px;
    line-height: 1.7;
    margin-top: 8px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: #222;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}


/* =========================
   التصميم
========================= */

.canvas-wrapper {
    margin-top: 20px;
    background: #eee;
    border-radius: 15px;
    padding: 15px;
    overflow: auto;
    text-align: center;
}

#designCanvas {
    position: relative;
    display: inline-block;
    line-height: 0;
    user-select: none;
}

#designImage {
    display: block;
    max-width: 100%;
    height: auto;
}


/* =========================
   العناصر
========================= */

.draggable {
    position: absolute;
    cursor: move;
    border: 2px dashed rgba(0,0,0,0.55);
    background: rgba(255,255,255,0.72);
    z-index: 5;
    user-select: none;
    line-height: normal;
    touch-action: none;
}

#nameElement {
    padding: 7px 12px;
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
    transform: translate(-50%, -50%);
}

#qrElement {
    width: 110px;
    height: 110px;
    padding: 5px;
    transform: translate(-50%, -50%);
}

#qrElement img {
    width: 100%;
    height: 100%;
    display: block;
}

.selected {
    border-color: #222;
}


/* =========================
   التحكم
========================= */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.control-box {
    background: #faf9f7;
    padding: 15px;
    border-radius: 12px;
}

.control-box label {
    font-size: 13px;
}


/* =========================
   أزرار المحاذاة
========================= */

.alignment-title {
    margin-top: 15px;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: bold;
}

.alignment-buttons {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
}

.alignment-buttons button {
    margin-top: 0;
    padding: 9px 5px;
    font-size: 12px;
    background: #ddd;
    color: #222;
}

.alignment-buttons button.active {
    background: #222;
    color: white;
}

.center-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 6px;
}

.center-buttons button {
    margin-top: 0;
    padding: 9px 5px;
    font-size: 12px;
    background: #777;
}


/* =========================
   المعاينة
========================= */

.preview-area {
    background: #eee;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    overflow: auto;
}

#previewCanvas {
    position: relative;
    display: inline-block;
    line-height: 0;
}

#previewImage {
    display: block;
    max-width: 100%;
    height: auto;
}

.preview-name {
    position: absolute;
    padding: 5px 10px;
    font-weight: bold;
    white-space: nowrap;
    line-height: normal;
    z-index: 2;
    transform: translate(-50%, -50%);
}

.preview-qr {
    position: absolute;
    z-index: 2;
    transform: translate(-50%, -50%);
}

.preview-qr img {
    width: 100%;
    height: 100%;
    display: block;
}


/* =========================
   الرسائل
========================= */

.message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.7;
}

.success {
    color: #287a4b;
}

.error {
    color: #c0392b;
}


@media (max-width: 600px) {

    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .box {
        padding: 20px;
    }

    .controls {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<h1>
تصميم الدعوات
</h1>


<div class="subtitle">

ارفعي تصميمك وحددي مكان الاسم والـ QR مرة واحدة

</div>


<!-- =========================
     رفع التصميم
========================= -->

<div class="section">

<label>
تصميم الدعوة
</label>

<input
    id="designFile"
    type="file"
    accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
>

<div class="hint">

ارفعي تصميم الدعوة بصيغة PNG أو JPG أو WEBP.

</div>

</div>


<!-- =========================
     مساحة التصميم
========================= -->

<div
    id="canvasWrapper"
    class="canvas-wrapper"
    style="display:none;">

<div id="designCanvas">

<img
    id="designImage"
    draggable="false"
>

<div
    id="nameElement"
    class="draggable">

اسم المدعو

</div>

<div
    id="qrElement"
    class="draggable">

<img
    id="qrImage"
    alt="QR"
>

</div>

</div>

</div>


<!-- =========================
     التحكم
========================= -->

<div
    id="controlsSection"
    class="section"
    style="display:none;">

<h3>
تحكم بالعناصر
</h3>


<div class="controls">


<!-- =========================
     الاسم
========================= -->

<div class="control-box">

<label>
حجم الاسم
</label>

<input
    id="nameSize"
    type="number"
    min="8"
    max="100"
    value="22"
>

<button
    id="applyNameSize"
    type="button">

تطبيق حجم الاسم

</button>


<div class="alignment-title">
محاذاة الاسم
</div>

<div class="alignment-buttons">

<button
    id="nameAlignRight"
    type="button">

يمين

</button>

<button
    id="nameAlignCenter"
    type="button"
    class="active">

وسط

</button>

<button
    id="nameAlignLeft"
    type="button">

يسار

</button>

</div>


<div class="center-buttons">

<button
    id="nameCenterHorizontal"
    type="button">

توسيط أفقي

</button>

<button
    id="nameCenterVertical"
    type="button">

توسيط عمودي

</button>

</div>

</div>


<!-- =========================
     QR
========================= -->

<div class="control-box">

<label>
حجم QR
</label>

<input
    id="qrSize"
    type="number"
    min="50"
    max="500"
    value="110"
>

<button
    id="applyQrSize"
    type="button">

تطبيق حجم QR

</button>


<div class="alignment-title">
محاذاة QR
</div>

<div class="alignment-buttons">

<button
    id="qrAlignRight"
    type="button">

يمين

</button>

<button
    id="qrAlignCenter"
    type="button"
    class="active">

وسط

</button>

<button
    id="qrAlignLeft"
    type="button">

يسار

</button>

</div>


<div class="center-buttons">

<button
    id="qrCenterHorizontal"
    type="button">

توسيط أفقي

</button>

<button
    id="qrCenterVertical"
    type="button">

توسيط عمودي

</button>

</div>

</div>

</div>


<div class="hint">

اسحبي الاسم والـ QR داخل التصميم إلى المكان الذي تريدينه.

</div>

</div>


<!-- =========================
     المعاينة
========================= -->

<div
    id="previewSection"
    class="section"
    style="display:none;">

<h3>
معاينة الدعوة
</h3>

<div class="preview-area">

<div id="previewCanvas">

<img
    id="previewImage"
>

<div
    id="previewName"
    class="preview-name">

سارة محمد

</div>

<div
    id="previewQr"
    class="preview-qr">

<img
    id="previewQrImage"
>

</div>

</div>

</div>

<div class="hint">

هذه المعاينة توضح الشكل النهائي للدعوة قبل التوليد.

</div>

</div>


<!-- =========================
     الأزرار
========================= -->

<div
    id="buttonsSection"
    style="display:none;">

<button
    id="saveButton"
    type="button">

حفظ التصميم

</button>


<button
    id="generateButton"
    type="button">

توليد الدعوات

</button>

</div>


<div
    id="message"
    class="message">

</div>


</div>

</div>


<script>


/* =========================
   قراءة event_id
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    params.get("event_id");


/* =========================
   بيانات التصميم
========================= */

let designData = {

    image: null,

    /*
       x و y يمثلان مركز العنصر
       كنسبة من التصميم.

       0 = البداية
       0.5 = المنتصف
       1 = النهاية
    */

    nameX: 0.5,
    nameY: 0.5,

    qrX: 0.75,
    qrY: 0.75,


    /*
       الأحجام كنسبة من عرض التصميم.
    */

    nameSizeRatio: null,

    qrSizeRatio: null,


    /*
       الأحجام الأصلية للعرض.
    */

    nameSize: 22,

    qrSize: 110,


    /*
       محاذاة الاسم.
    */

    nameAlign: "center",


    /*
       محاذاة QR.
    */

    qrAlign: "center"

};


let activeElement = null;

let dragging = false;

let offsetX = 0;

let offsetY = 0;


/* =========================
   التحقق
========================= */

if (!eventId) {

    showMessage(
        "رابط الحفل غير صحيح.",
        "error"
    );

}


/* =========================
   QR تجريبي
========================= */

const demoQR =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=DEMO";


document.getElementById(
    "qrImage"
).src = demoQR;


document.getElementById(
    "previewQrImage"
).src = demoQR;


/* =========================
   رفع التصميم
========================= */

document
    .getElementById("designFile")
    .addEventListener(
        "change",
        loadDesign
    );


function loadDesign(event) {

    const file =
        event.target.files[0];


    if (!file) {
        return;
    }


    const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/webp"
    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        showMessage(
            "صيغة الصورة غير مدعومة.",
            "error"
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            designData.image =
                e.target.result;


            const image =
                document.getElementById(
                    "designImage"
                );


            const previewImage =
                document.getElementById(
                    "previewImage"
                );


            image.src =
                designData.image;


            previewImage.src =
                designData.image;


            image.onload =
                function() {

                    document.getElementById(
                        "canvasWrapper"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "controlsSection"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "previewSection"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "buttonsSection"
                    ).style.display =
                        "block";


                    initializeDesign();

                };

        };


    reader.readAsDataURL(file);

}


/* =========================
   تهيئة التصميم
========================= */

function initializeDesign() {

    const canvas =
        document.getElementById(
            "designCanvas"
        );


    if (
        !canvas.clientWidth
    ) {
        return;
    }


    /*
       إذا كانت هناك بيانات قديمة
       محفوظة في localStorage،
       نحاول قراءتها.

       لكن لا نستبدل التصميم
       الجديد إذا رفعت صورة جديدة.
    */

    const saved =
        localStorage.getItem(
            `invitation_design_${eventId}`
        );


    if (saved) {

        try {

            const oldData =
                JSON.parse(saved);


            /*
               نستفيد فقط من الإعدادات
               إذا كانت الصورة نفسها.
            */

            if (
                oldData &&
                oldData.image ===
                designData.image
            ) {

                designData =
                    {
                        ...designData,
                        ...oldData
                    };

            }

        }

        catch (error) {

            console.warn(
                "تعذر قراءة التصميم المحفوظ."
            );

        }

    }


    /*
       دعم التصميمات القديمة
       التي كانت تستخدم px
       أو nameSizeRatio غير موجود.
    */

    if (
        !designData.nameSizeRatio
    ) {

        designData.nameSizeRatio =
            Number(
                designData.nameSize || 22
            ) /
            canvas.clientWidth;

    }


    if (
        !designData.qrSizeRatio
    ) {

        designData.qrSizeRatio =
            Number(
                designData.qrSize || 110
            ) /
            canvas.clientWidth;

    }


    /*
       التأكد من المحاذاة.
    */

    if (
        !designData.nameAlign
    ) {

        designData.nameAlign =
            "center";

    }


    if (
        !designData.qrAlign
    ) {

        designData.qrAlign =
            "center";

    }


    /*
       تحديث حقول الأحجام.
    */

    document.getElementById(
        "nameSize"
    ).value =
        Math.round(
            designData.nameSizeRatio *
            canvas.clientWidth
        );


    document.getElementById(
        "qrSize"
    ).value =
        Math.round(
            designData.qrSizeRatio *
            canvas.clientWidth
        );


    updateAlignmentButtons();

    positionElements();

    updatePreview();

}


/* =========================
   الحصول على حجم الاسم
========================= */

function getNameSize() {

    const canvas =
        document.getElementById(
            "designCanvas"
        );


    return (
        designData.nameSizeRatio *
        canvas.clientWidth
    );

}


/* =========================
   الحصول على حجم QR
========================= */

function getQrSize() {

    const canvas =
        document.getElementById(
            "designCanvas"
        );


    return (
        designData.qrSizeRatio *
        canvas.clientWidth
    );

}


/* =========================
   وضع العناصر
========================= */

function positionElements() {

    const canvas =
        document.getElementById(
            "designCanvas"
        );


    const name =
        document.getElementById(
            "nameElement"
        );


    const qr =
        document.getElementById(
            "qrElement"
        );


    if (
        !canvas.clientWidth ||
        !canvas.clientHeight
    ) {
        return;
    }


    /*
       حجم الاسم.
    */

    const nameSize =
        getNameSize();


    designData.nameSize =
        nameSize;


    name.style.fontSize =
        nameSize + "px";


    /*
       حجم QR.
    */

    const qrSize =
        getQrSize();


    designData.qrSize =
        qrSize;


    qr.style.width =
        qrSize + "px";


    qr.style.height =
        qrSize + "px";


    /*
       مكان الاسم.

       الآن x/y يمثلان المركز.
    */

    name.style.left =
        (
            designData.nameX *
            100
        ) + "%";


    name.style.top =
        (
            designData.nameY *
            100
        ) + "%";


    /*
       مكان QR.
    */

    qr.style.left =
        (
            designData.qrX *
            100
        ) + "%";


    qr.style.top =
        (
            designData.qrY *
            100
        ) + "%";

}


/* =========================
   السحب بالماوس
========================= */

document
    .getElementById(
        "nameElement"
    )
    .addEventListener(
        "mousedown",
        startDrag
    );


document
    .getElementById(
        "qrElement"
    )
    .addEventListener(
        "mousedown",
        startDrag
    );


document.addEventListener(
    "mousemove",
    drag
);


document.addEventListener(
    "mouseup",
    stopDrag
);


/* =========================
   السحب باللمس
========================= */

document
    .getElementById(
        "nameElement"
    )
    .addEventListener(
        "touchstart",
        startTouch,
        {
            passive: false
        }
    );


document
    .getElementById(
        "qrElement"
    )
    .addEventListener(
        "touchstart",
        startTouch,
        {
            passive: false
        }
    );


document.addEventListener(
    "touchmove",
    moveTouch,
    {
        passive: false
    }
);


document.addEventListener(
    "touchend",
    stopDrag
);


/* =========================
   بدء السحب
========================= */

function startDrag(event) {

    event.preventDefault();


    activeElement =
        event.currentTarget;


    dragging = true;


    const rect =
        activeElement.getBoundingClientRect();


    offsetX =
        event.clientX -
        (
            rect.left +
            rect.width / 2
        );


    offsetY =
        event.clientY -
        (
            rect.top +
            rect.height / 2
        );


    activeElement.classList.add(
        "selected"
    );

}


/* =========================
   بدء اللمس
========================= */

function startTouch(event) {

    event.preventDefault();


    const touch =
        event.touches[0];


    activeElement =
        event.currentTarget;


    dragging = true;


    const rect =
        activeElement.getBoundingClientRect();


    offsetX =
        touch.clientX -
        (
            rect.left +
            rect.width / 2
        );


    offsetY =
        touch.clientY -
        (
            rect.top +
            rect.height / 2
        );


    activeElement.classList.add(
        "selected"
    );

}


/* =========================
   تحريك بالماوس
========================= */

function drag(event) {

    if (
        !dragging ||
        !activeElement
    ) {
        return;
    }


    moveElement(
        event.clientX,
        event.clientY
    );

}


/* =========================
   تحريك باللمس
========================= */

function moveTouch(event) {

    if (
        !dragging ||
        !activeElement
    ) {
        return;
    }


    event.preventDefault();


    const touch =
        event.touches[0];


    moveElement(
        touch.clientX,
        touch.clientY
    );

}


/* =========================
   تحريك العنصر
========================= */

function moveElement(
    clientX,
    clientY
) {

    const canvas =
        document.getElementById(
            "designCanvas"
        );


    const canvasRect =
        canvas.getBoundingClientRect();


    /*
       نحسب مركز العنصر.
    */

    let centerX =
        clientX -
        canvasRect.left -
        offsetX;


    let centerY =
        clientY -
        canvasRect.top -
        offsetY;


    /*
       نمنع المركز من الخروج
       خارج التصميم.
    */

    const halfWidth =
        activeElement.offsetWidth /
        2;


    const halfHeight =
        activeElement.offsetHeight /
        2;


    centerX =
        Math.max(
            halfWidth,
            Math.min(
                centerX,
                canvas.clientWidth -
                halfWidth
            )
        );


    centerY =
        Math.max(
            halfHeight,
            Math.min(
                centerY,
                canvas.clientHeight -
                halfHeight
            )
        );


    /*
       تحويل المكان إلى نسبة.
    */

    const xRatio =
        centerX /
        canvas.clientWidth;


    const yRatio =
        centerY /
        canvas.clientHeight;


    /*
       حفظ الإحداثيات.
    */

    if (
        activeElement.id ===
        "nameElement"
    ) {

        designData.nameX =
            xRatio;


        designData.nameY =
            yRatio;

    }


    if (
        activeElement.id ===
        "qrElement"
    ) {

        designData.qrX =
            xRatio;


        designData.qrY =
            yRatio;

    }


    positionElements();

    updatePreview();

}


/* =========================
   إيقاف السحب
========================= */

function stopDrag() {

    if (activeElement) {

        activeElement.classList.remove(
            "selected"
        );

    }


    dragging = false;

    activeElement = null;

}


/* =========================
   حجم الاسم
========================= */

document
    .getElementById(
        "applyNameSize"
    )
    .addEventListener(
        "click",
        function() {

            const size =
                Number(
                    document
                        .getElementById(
                            "nameSize"
                        )
                        .value
                );


            if (
                size < 8 ||
                size > 100
            ) {

                showMessage(
                    "حجم الاسم يجب أن يكون بين 8 و100.",
                    "error"
                );

                return;
            }


            const canvas =
                document.getElementById(
                    "designCanvas"
                );


            designData.nameSize =
                size;


            designData.nameSizeRatio =
                size /
                canvas.clientWidth;


            positionElements();

            updatePreview();

        }
    );


/* =========================
   حجم QR
========================= */

document
    .getElementById(
        "applyQrSize"
    )
    .addEventListener(
        "click",
        function() {

            const size =
                Number(
                    document
                        .getElementById(
                            "qrSize"
                        )
                        .value
                );


            if (
                size < 50 ||
                size > 500
            ) {

                showMessage(
                    "حجم QR يجب أن يكون بين 50 و500.",
                    "error"
                );

                return;
            }


            const canvas =
                document.getElementById(
                    "designCanvas"
                );


            designData.qrSize =
                size;


            designData.qrSizeRatio =
                size /
                canvas.clientWidth;


            positionElements();

            updatePreview();

        }
    );

/* =========================
   تحديث المعاينة
========================= */

function updatePreview() {

    if (!designData.image) {
        return;
    }


    const designCanvas =
        document.getElementById(
            "designCanvas"
        );


    const previewCanvas =
        document.getElementById(
            "previewCanvas"
        );


    const previewName =
        document.getElementById(
            "previewName"
        );


    const previewQr =
        document.getElementById(
            "previewQr"
        );


    const width =
        designCanvas.clientWidth;


    const height =
        designCanvas.clientHeight;


    if (
        !width ||
        !height
    ) {
        return;
    }


    /*
       نفس أبعاد التصميم.
    */

    previewCanvas.style.width =
        width + "px";


    previewCanvas.style.height =
        height + "px";


    /*
       الاسم.
    */

    previewName.style.left =
        (
            designData.nameX *
            100
        ) + "%";


    previewName.style.top =
        (
            designData.nameY *
            100
        ) + "%";


    previewName.style.fontSize =
        (
            designData.nameSizeRatio *
            width
        ) + "px";


    /*
       QR.
    */

    previewQr.style.left =
        (
            designData.qrX *
            100
        ) + "%";


    previewQr.style.top =
        (
            designData.qrY *
            100
        ) + "%";


    const previewQrSize =
        designData.qrSizeRatio *
        width;


    previewQr.style.width =
        previewQrSize + "px";


    previewQr.style.height =
        previewQrSize + "px";

}


/* =========================
   حفظ التصميم
========================= */

document
    .getElementById(
        "saveButton"
    )
    .addEventListener(
        "click",
        saveDesign
    );


function saveDesign() {

    if (!designData.image) {

        showMessage(
            "ارفعي التصميم أولًا.",
            "error"
        );

        return false;

    }


    const canvas =
        document.getElementById(
            "designCanvas"
        );


    /*
       التأكد من الأحجام
       قبل الحفظ.
    */

    if (
        !designData.nameSizeRatio
    ) {

        designData.nameSizeRatio =
            designData.nameSize /
            canvas.clientWidth;

    }


    if (
        !designData.qrSizeRatio
    ) {

        designData.qrSizeRatio =
            designData.qrSize /
            canvas.clientWidth;

    }


    /*
       تحديث الأحجام الحالية.
    */

    designData.nameSize =
        designData.nameSizeRatio *
        canvas.clientWidth;


    designData.qrSize =
        designData.qrSizeRatio *
        canvas.clientWidth;


    /*
       الحفظ.
    */

    localStorage.setItem(

        `invitation_design_${eventId}`,

        JSON.stringify(
            designData
        )

    );


    showMessage(
        "تم حفظ التصميم ومواقع العناصر بنجاح 🤍",
        "success"
    );


    return true;

}


/* =========================
   توليد الدعوات
========================= */

document
    .getElementById(
        "generateButton"
    )
    .addEventListener(
        "click",
        function() {

            if (!designData.image) {

                showMessage(
                    "ارفعي التصميم أولًا.",
                    "error"
                );

                return;

            }


            const saved =
                saveDesign();


            if (!saved) {
                return;
            }


            window.location.href =
                "generate.html?event_id=" +
                encodeURIComponent(
                    eventId
                );

        }
    );


/* =========================
   إعادة ضبط عند تغيير الحجم
========================= */

window.addEventListener(
    "resize",
    function() {

        if (!designData.image) {
            return;
        }


        positionElements();

        updatePreview();

    }
);


/* =========================
   الرسائل
========================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        "message " +
        type;

}
