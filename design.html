```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تصميم الدعوات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f6f3;
    color: #222;
}

.container {
    max-width: 850px;
    margin: 40px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
}

.section {
    margin-top: 25px;
    padding-top: 25px;
    border-top: 1px solid #eee;
}

.section:first-of-type {
    border-top: 0;
    padding-top: 0;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input[type="file"],
input[type="number"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
}

input:focus {
    outline: none;
    border-color: #888;
}

.hint {
    color: #888;
    font-size: 13px;
    line-height: 1.7;
    margin-top: 8px;
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: #222;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}


/* =========================
   التصميم
========================= */

.canvas-wrapper {
    margin-top: 20px;
    background: #eee;
    border-radius: 15px;
    padding: 15px;
    overflow: auto;
    text-align: center;
}

#designCanvas {
    position: relative;
    display: inline-block;
    line-height: 0;
    user-select: none;
}

#designImage {
    display: block;
    max-width: 100%;
    height: auto;
}


/* =========================
   العناصر
========================= */

.draggable {
    position: absolute;
    cursor: move;
    border: 2px dashed rgba(0,0,0,0.55);
    background: rgba(255,255,255,0.72);
    z-index: 5;
    user-select: none;
    line-height: normal;
}

#nameElement {
    padding: 7px 12px;
    font-size: 22px;
    font-weight: bold;
    white-space: nowrap;
}

#qrElement {
    width: 110px;
    height: 110px;
    padding: 5px;
}

#qrElement img {
    width: 100%;
    height: 100%;
    display: block;
}

.selected {
    border-color: #222;
}


/* =========================
   التحكم
========================= */

.controls {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.control-box {
    background: #faf9f7;
    padding: 15px;
    border-radius: 12px;
}

.control-box label {
    font-size: 13px;
}


/* =========================
   المعاينة
========================= */

.preview-area {
    background: #eee;
    border-radius: 15px;
    padding: 15px;
    text-align: center;
    overflow: auto;
}

#previewCanvas {
    position: relative;
    display: inline-block;
    line-height: 0;
}

#previewImage {
    display: block;
    max-width: 100%;
    height: auto;
}

.preview-name {
    position: absolute;
    padding: 5px 10px;
    font-weight: bold;
    white-space: nowrap;
    line-height: normal;
    z-index: 2;
}

.preview-qr {
    position: absolute;
    z-index: 2;
}

.preview-qr img {
    width: 100%;
    height: 100%;
    display: block;
}


/* =========================
   الرسائل
========================= */

.message {
    text-align: center;
    margin-top: 15px;
    font-size: 14px;
    line-height: 1.7;
}

.success {
    color: #287a4b;
}

.error {
    color: #c0392b;
}


@media (max-width: 600px) {

    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .box {
        padding: 20px;
    }

    .controls {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<h1>
تصميم الدعوات
</h1>


<div class="subtitle">

ارفعي تصميمك وحددي مكان الاسم والـ QR مرة واحدة

</div>


<!-- =========================
     رفع التصميم
========================= -->

<div class="section">

<label>
تصميم الدعوة
</label>

<input
    id="designFile"
    type="file"
    accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
>

<div class="hint">

ارفعي تصميم الدعوة بصيغة PNG أو JPG أو WEBP.

</div>

</div>


<!-- =========================
     مساحة التصميم
========================= -->

<div
    id="canvasWrapper"
    class="canvas-wrapper"
    style="display:none;">

<div id="designCanvas">

<img
    id="designImage"
    draggable="false"
>

<div
    id="nameElement"
    class="draggable">

اسم المدعو

</div>

<div
    id="qrElement"
    class="draggable">

<img
    id="qrImage"
    alt="QR"
>

</div>

</div>

</div>


<!-- =========================
     التحكم
========================= -->

<div
    id="controlsSection"
    class="section"
    style="display:none;">

<h3>
تحكم بالعناصر
</h3>


<div class="controls">


<div class="control-box">

<label>
حجم الاسم
</label>

<input
    id="nameSize"
    type="number"
    min="8"
    max="100"
    value="22"
>

<button
    id="applyNameSize"
    type="button">

تطبيق حجم الاسم

</button>

</div>


<div class="control-box">

<label>
حجم QR
</label>

<input
    id="qrSize"
    type="number"
    min="50"
    max="500"
    value="110"
>

<button
    id="applyQrSize"
    type="button">

تطبيق حجم QR

</button>

</div>

</div>


<div class="hint">

اسحبي الاسم والـ QR داخل التصميم إلى المكان الذي تريدينه.

</div>

</div>


<!-- =========================
     المعاينة
========================= -->

<div
    id="previewSection"
    class="section"
    style="display:none;">

<h3>
معاينة الدعوة
</h3>

<div class="preview-area">

<div id="previewCanvas">

<img
    id="previewImage"
>

<div
    id="previewName"
    class="preview-name">

سارة محمد

</div>

<div
    id="previewQr"
    class="preview-qr">

<img
    id="previewQrImage"
>

</div>

</div>

</div>

<div class="hint">

هذه المعاينة توضح الشكل النهائي للدعوة قبل التوليد.

</div>

</div>


<!-- =========================
     الأزرار
========================= -->

<div
    id="buttonsSection"
    style="display:none;">

<button
    id="saveButton"
    type="button">

حفظ التصميم

</button>


<button
    id="generateButton"
    type="button">

توليد الدعوات

</button>

</div>


<div
    id="message"
    class="message">

</div>


</div>

</div>


<script>


/* =========================
   المتغيرات
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    params.get("event_id");


let designData = {

    image: null,

    nameX: 0.5,

    nameY: 0.5,

    qrX: 0.75,

    qrY: 0.75,

    nameSize: 22,

    qrSize: 110

};


let activeElement = null;

let dragging = false;

let offsetX = 0;

let offsetY = 0;


/* =========================
   التحقق
========================= */

if (!eventId) {

    showMessage(
        "رابط الحفل غير صحيح.",
        "error"
    );

}


/* =========================
   QR تجريبي
========================= */

const demoQR =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=DEMO";


document.getElementById(
    "qrImage"
).src = demoQR;

document.getElementById(
    "previewQrImage"
).src = demoQR;


/* =========================
   رفع التصميم
========================= */

document
    .getElementById("designFile")
    .addEventListener(
        "change",
        loadDesign
    );


function loadDesign(event) {

    const file =
        event.target.files[0];


    if (!file) return;


    const allowedTypes = [
        "image/png",
        "image/jpeg",
        "image/webp"
    ];


    if (
        !allowedTypes.includes(
            file.type
        )
    ) {

        showMessage(
            "صيغة الصورة غير مدعومة.",
            "error"
        );

        return;
    }


    const reader =
        new FileReader();


    reader.onload =
        function(e) {

            designData.image =
                e.target.result;


            const image =
                document.getElementById(
                    "designImage"
                );


            const previewImage =
                document.getElementById(
                    "previewImage"
                );


            image.src =
                designData.image;


            previewImage.src =
                designData.image;


            image.onload =
                function() {

                    document.getElementById(
                        "canvasWrapper"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "controlsSection"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "previewSection"
                    ).style.display =
                        "block";


                    document.getElementById(
                        "buttonsSection"
                    ).style.display =
                        "block";


                    positionElements();

                    updatePreview();

                };

        };


    reader.readAsDataURL(file);

}


/* =========================
   وضع العناصر
========================= */

function positionElements() {

    const canvas =
        document.getElementById(
            "designCanvas"
        );


    const name =
        document.getElementById(
            "nameElement"
        );


    const qr =
        document.getElementById(
            "qrElement"
        );


    name.style.left =
        (
            designData.nameX *
            canvas.clientWidth
        ) + "px";


    name.style.top =
        (
            designData.nameY *
            canvas.clientHeight
        ) + "px";


    qr.style.left =
        (
            designData.qrX *
            canvas.clientWidth
        ) + "px";


    qr.style.top =
        (
            designData.qrY *
            canvas.clientHeight
        ) + "px";


    name.style.fontSize =
        designData.nameSize +
        "px";


    qr.style.width =
        designData.qrSize +
        "px";


    qr.style.height =
        designData.qrSize +
        "px";

}


/* =========================
   السحب
========================= */

document
    .getElementById(
        "nameElement"
    )
    .addEventListener(
        "mousedown",
        startDrag
    );


document
    .getElementById(
        "qrElement"
    )
    .addEventListener(
        "mousedown",
        startDrag
    );


document.addEventListener(
    "mousemove",
    drag
);


document.addEventListener(
    "mouseup",
    stopDrag
);


/* دعم اللمس */

document
    .getElementById(
        "nameElement"
    )
    .addEventListener(
        "touchstart",
        startTouch,
        {
            passive: false
        }
    );


document
    .getElementById(
        "qrElement"
    )
    .addEventListener(
        "touchstart",
        startTouch,
        {
            passive: false
        }
    );


document.addEventListener(
    "touchmove",
    moveTouch,
    {
        passive: false
    }
);


document.addEventListener(
    "touchend",
    stopDrag
);


function startDrag(event) {

    activeElement =
        event.currentTarget;


    dragging = true;


    const rect =
        activeElement.getBoundingClientRect();


    offsetX =
        event.clientX -
        rect.left;


    offsetY =
        event.clientY -
        rect.top;


    activeElement.classList.add(
        "selected"
    );

}


function startTouch(event) {

    event.preventDefault();


    const touch =
        event.touches[0];


    activeElement =
        event.currentTarget;


    dragging = true;


    const rect =
        activeElement.getBoundingClientRect();


    offsetX =
        touch.clientX -
        rect.left;


    offsetY =
        touch.clientY -
        rect.top;


    activeElement.classList.add(
        "selected"
    );

}


function drag(event) {

    if (
        !dragging ||
        !activeElement
    ) return;


    moveElement(
        event.clientX,
        event.clientY
    );

}


function moveTouch(event) {

    if (
        !dragging ||
        !activeElement
    ) return;


    event.preventDefault();


    const touch =
        event.touches[0];


    moveElement(
        touch.clientX,
        touch.clientY
    );

}


function moveElement(
    clientX,
    clientY
) {

    const canvas =
        document.getElementById(
            "designCanvas"
        );


    const canvasRect =
        canvas.getBoundingClientRect();


    let x =
        clientX -
        canvasRect.left -
        offsetX;


    let y =
        clientY -
        canvasRect.top -
        offsetY;


    x =
        Math.max(
            0,
            Math.min(
                x,
                canvas.clientWidth -
                activeElement.offsetWidth
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                y,
                canvas.clientHeight -
                activeElement.offsetHeight
            )
        );


    activeElement.style.left =
        x + "px";


    activeElement.style.top =
        y + "px";


    if (
        activeElement.id ===
        "nameElement"
    ) {

        designData.nameX =
            x /
            canvas.clientWidth;


        designData.nameY =
            y /
            canvas.clientHeight;

    }


    if (
        activeElement.id ===
        "qrElement"
    ) {

        designData.qrX =
            x /
            canvas.clientWidth;


        designData.qrY =
            y /
            canvas.clientHeight;

    }


    updatePreview();

}


function stopDrag() {

    if (activeElement) {

        activeElement.classList.remove(
            "selected"
        );

    }


    dragging = false;

    activeElement = null;

}


/* =========================
   حجم الاسم
========================= */

document
    .getElementById(
        "applyNameSize"
    )
    .addEventListener(
        "click",
        function() {

            const size =
                Number(
                    document
                        .getElementById(
                            "nameSize"
                        )
                        .value
                );


            if (
                size < 8 ||
                size > 100
            ) {

                showMessage(
                    "حجم الاسم يجب أن يكون بين 8 و100.",
                    "error"
                );

                return;
            }


            designData.nameSize =
                size;


            document
                .getElementById(
                    "nameElement"
                )
                .style.fontSize =
                size + "px";


            updatePreview();

        }
    );


/* =========================
   حجم QR
========================= */

document
    .getElementById(
        "applyQrSize"
    )
    .addEventListener(
        "click",
        function() {

            const size =
                Number(
                    document
                        .getElementById(
                            "qrSize"
                        )
                        .value
                );


            if (
                size < 50 ||
                size > 500
            ) {

                showMessage(
                    "حجم QR يجب أن يكون بين 50 و500.",
                    "error"
                );

                return;
            }


            designData.qrSize =
                size;


            const qr =
                document.getElementById(
                    "qrElement"
                );


            qr.style.width =
                size + "px";


            qr.style.height =
                size + "px";


            updatePreview();

        }
    );


/* =========================
   تحديث المعاينة
========================= */

function updatePreview() {

    if (!designData.image) {
        return;
    }


    const previewCanvas =
        document.getElementById(
            "previewCanvas"
        );


    const previewName =
        document.getElementById(
            "previewName"
        );


    const previewQr =
        document.getElementById(
            "previewQr"
        );


    /*
       نستخدم نفس أبعاد الصورة الأصلية
       حتى تبقى الأماكن متطابقة.
    */

    const designCanvas =
        document.getElementById(
            "designCanvas"
        );


    const width =
        designCanvas.clientWidth;


    const height =
        designCanvas.clientHeight;


    previewCanvas.style.width =
        width + "px";


    previewCanvas.style.height =
        height + "px";


    previewName.style.left =
        (
            designData.nameX *
            width
        ) + "px";


    previewName.style.top =
        (
            designData.nameY *
            height
        ) + "px";


    previewName.style.fontSize =
        designData.nameSize +
        "px";


    previewQr.style.left =
        (
            designData.qrX *
            width
        ) + "px";


    previewQr.style.top =
        (
            designData.qrY *
            height
        ) + "px";


    previewQr.style.width =
        designData.qrSize +
        "px";


    previewQr.style.height =
        designData.qrSize +
        "px";

}


/* =========================
   حفظ التصميم
========================= */

document
    .getElementById(
        "saveButton"
    )
    .addEventListener(
        "click",
        saveDesign
    );


function saveDesign() {

    if (!designData.image) {

        showMessage(
            "ارفعي التصميم أولًا.",
            "error"
        );

        return false;
    }


    localStorage.setItem(

        `invitation_design_${eventId}`,

        JSON.stringify(
            designData
        )

    );


    showMessage(
        "تم حفظ التصميم ومواقع العناصر بنجاح 🤍",
        "success"
    );


    return true;

}


/* =========================
   توليد الدعوات
========================= */

document
    .getElementById(
        "generateButton"
    )
    .addEventListener(
        "click",
        function() {

            if (!designData.image) {

                showMessage(
                    "ارفعي التصميم أولًا.",
                    "error"
                );

                return;
            }


            saveDesign();


            window.location.href =
                "generate.html?event_id=" +
                encodeURIComponent(
                    eventId
                );

        }
    );


/* =========================
   إعادة ضبط المعاينة عند تغيير الحجم
========================= */

window.addEventListener(
    "resize",
    function() {

        if (designData.image) {

            positionElements();

            updatePreview();

        }

    }
);


/* =========================
   الرسائل
========================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        "message " +
        type;

}

</script>

</body>

</html>
```
