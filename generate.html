<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>توليد الدعوات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f6f3;
    color: #222;
}

.container {
    max-width: 950px;
    margin: 40px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
}


/* =========================
   المعلومات
========================= */

.info {
    background: #faf9f7;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid #eee;
}

.info-row:last-child {
    border-bottom: 0;
}


/* =========================
   الأزرار
========================= */

button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: #222;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.secondary {
    background: #777;
}


/* =========================
   شبكة الدعوات
========================= */

.invitation-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 20px;
    margin-top: 25px;
}


/* =========================
   بطاقة الدعوة
========================= */

.invitation-card {
    background: #eee;
    border-radius: 15px;
    padding: 12px;
    text-align: center;
}

.invitation-title {
    font-weight: bold;
    margin-bottom: 10px;
}


/* =========================
   التصميم النهائي
========================= */

.invitation-canvas {
    position: relative;
    display: inline-block;
    max-width: 100%;
    line-height: 0;
    overflow: hidden;
}

.invitation-canvas > img.background {
    display: block;
    width: 100%;
    height: auto;
}

.guest-name {
    position: absolute;
    white-space: nowrap;
    line-height: normal;
    z-index: 2;
}

.guest-qr {
    position: absolute;
    z-index: 3;
}

.guest-qr img {
    width: 100%;
    height: 100%;
    display: block;
}


/* =========================
   التحميل
========================= */

.loading {
    text-align: center;
    padding: 35px;
    color: #888;
}

.message {
    text-align: center;
    margin-top: 15px;
    line-height: 1.7;
}

.success {
    color: #287a4b;
}

.error {
    color: #c0392b;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 700px) {

    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .box {
        padding: 20px;
    }

    .invitation-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<h1>
توليد الدعوات
</h1>


<div class="subtitle">

راجعي الدعوات قبل تنزيلها

</div>


<!-- =========================
     معلومات الحفل
========================= -->

<div
    id="eventInfo"
    class="info"
    style="display:none;">

<div class="info-row">

<span>
اسم الحفل
</span>

<strong id="eventName">
-
</strong>

</div>


<div class="info-row">

<span>
عدد الدعوات
</span>

<strong id="invitationCount">
-
</strong>

</div>

</div>


<!-- =========================
     الحالة
========================= -->

<div
    id="loading"
    class="loading">

جاري تحميل الدعوات...

</div>


<!-- =========================
     الدعوات
========================= -->

<div
    id="invitationGrid"
    class="invitation-grid">

</div>


<!-- =========================
     الأزرار
========================= -->

<div
    id="actions"
    style="display:none;">

<button
    id="downloadImagesButton"
    type="button">

تنزيل الدعوات كصور

</button>


<button
    id="downloadPdfButton"
    type="button">

تنزيل جميع الدعوات PDF

</button>


<button
    id="downloadZipButton"
    type="button">

تنزيل الدعوات ZIP

</button>


<!-- =========================
     حفظ الأكواد فقط
========================= -->

<button
    id="downloadCodesButton"
    type="button">

حفظ الأكواد فقط بدون تصميم

</button>


<button
    id="backButton"
    class="secondary"
    type="button">

العودة لتعديل التصميم

</button>

</div>


<div
    id="message"
    class="message">

</div>


</div>

</div>


<script>

/* =========================
   الرابط
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );


const eventId =
    params.get("event_id");


/* =========================
   المتغيرات
========================= */

let eventData = null;

let invitations = [];

let designData = null;


/* =========================
   تشغيل الصفحة
========================= */

document.addEventListener(
    "DOMContentLoaded",
    loadPage
);


async function loadPage() {

    if (!eventId) {

        showMessage(
            "رابط الحفل غير صحيح.",
            "error"
        );

        hideLoading();

        return;
    }


    try {

        await loadDesign();

        await loadEvent();

        await loadInvitations();

        renderInvitations();

    }

    catch (error) {

        console.error(
            "GENERATE ERROR:",
            error
        );


        let message =
            "حدث خطأ أثناء تحميل الدعوات.";


        if (error && error.message) {

            message +=
                " السبب: " +
                error.message;

        }


        showMessage(
            message,
            "error"
        );


        hideLoading();

    }

}


/* =========================
   تحميل التصميم
========================= */

async function loadDesign() {

    const saved =
        localStorage.getItem(
            `invitation_design_${eventId}`
        );


    if (!saved) {

        throw new Error(
            "لم يتم العثور على التصميم المحفوظ. ارجعي إلى صفحة تصميم الدعوات واحفظي التصميم أولًا."
        );

    }


    try {

        designData =
            JSON.parse(saved);

    }

    catch (error) {

        throw new Error(
            "بيانات التصميم المحفوظة غير صالحة."
        );

    }


    if (
        !designData ||
        !designData.image
    ) {

        throw new Error(
            "صورة التصميم غير موجودة في التصميم المحفوظ."
        );

    }


    /*
       قيم افتراضية في حال كان التصميم
       محفوظًا من إصدار قديم.
    */

    designData.nameX =
        Number(
            designData.nameX ?? 0.5
        );


    designData.nameY =
        Number(
            designData.nameY ?? 0.5
        );


    designData.qrX =
        Number(
            designData.qrX ?? 0.75
        );


    designData.qrY =
        Number(
            designData.qrY ?? 0.75
        );


    designData.nameSize =
        Number(
            designData.nameSize ?? 22
        );


    designData.qrSize =
        Number(
            designData.qrSize ?? 110
        );


    /*
       دعم الخط
    */

    designData.nameFont =
        designData.nameFont ||
        "Arial";


    /*
       دعم المحاذاة إذا كانت موجودة
       في التصميم الجديد.
    */

    designData.nameAlign =
        designData.nameAlign ||
        "right";


    designData.qrAlign =
        designData.qrAlign ||
        "center";


    /*
       دعم لون الاسم والـ QR
    */

    designData.nameColor =
        designData.nameColor ||
        "#222222";


    designData.qrColor =
        designData.qrColor ||
        "#000000";

}


/* =========================
   تحميل الحفل
========================= */

async function loadEvent() {

    if (
        typeof supabaseClient ===
        "undefined"
    ) {

        throw new Error(
            "لم يتم تحميل Supabase. تأكدي من ملف config.js."
        );

    }


    const {
        data,
        error
    } =
        await supabaseClient

            .from("events")

            .select("*")

            .eq(
                "id",
                eventId
            )

            .single();


    if (error) {

        throw new Error(
            "تعذر تحميل بيانات الحفل: " +
            error.message
        );

    }


    if (!data) {

        throw new Error(
            "لم يتم العثور على الحفل."
        );

    }


    eventData =
        data;


    document.getElementById(
        "eventName"
    ).innerText =
        data.event_name || "-";


    document.getElementById(
        "eventInfo"
    ).style.display =
        "block";

}


/* =========================
   تحميل الدعوات
========================= */

async function loadInvitations() {

    const {
        data,
        error
    } =
        await supabaseClient

            .from("invitations")

            .select("*")

            .eq(
                "event_id",
                eventId
            )

            .order(
                "invitation_number",
                {
                    ascending: true
                }
            );


    if (error) {

        throw new Error(
            "تعذر تحميل الدعوات: " +
            error.message
        );

    }


    invitations =
        data || [];


    document.getElementById(
        "invitationCount"
    ).innerText =
        invitations.length;

}


/* =========================
   عرض الدعوات
========================= */

function renderInvitations() {

    const grid =
        document.getElementById(
            "invitationGrid"
        );


    grid.innerHTML =
        "";


    if (
        invitations.length === 0
    ) {

        hideLoading();


        showMessage(
            "لا توجد دعوات لهذا الحفل.",
            "error"
        );


        return;

    }


    invitations.forEach(
        function(
            invitation,
            index
        ) {

            const card =
                createInvitationCard(
                    invitation,
                    index
                );


            grid.appendChild(
                card
            );

        }
    );


    hideLoading();


    document.getElementById(
        "actions"
    ).style.display =
        "block";

}


/* =========================
   إنشاء بطاقة
========================= */

function createInvitationCard(
    invitation,
    index
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "invitation-card";


    const title =
        document.createElement(
            "div"
        );


    title.className =
        "invitation-title";


    title.innerText =
        invitation.guest_name ||
        `دعوة ${index + 1}`;


    card.appendChild(
        title
    );


    const canvas =
        document.createElement(
            "div"
        );


    canvas.className =
        "invitation-canvas";


    canvas.dataset.index =
        index;


    /*
       صورة الخلفية
    */

    const background =
        document.createElement(
            "img"
        );


    background.className =
        "background";


    background.src =
        designData.image;


    background.crossOrigin =
        "anonymous";


    canvas.appendChild(
        background
    );


    /*
       الاسم
    */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "guest-name";


    name.innerText =
        invitation.guest_name ||
        "اسم المدعو";


    name.style.left =
        (
            designData.nameX *
            100
        ) + "%";


    name.style.top =
        (
            designData.nameY *
            100
        ) + "%";


    name.style.fontSize =
        designData.nameSize +
        "px";


    name.style.fontFamily =
        designData.nameFont;


    name.style.color =
        designData.nameColor;


    name.style.textAlign =
        designData.nameAlign;


    /*
       دعم المحاذاة
    */

    if (
        designData.nameAlign ===
        "center"
    ) {

        name.style.transform =
            "translateX(-50%)";

    }

    else if (
        designData.nameAlign ===
        "right"
    ) {

        name.style.transform =
            "translateX(0)";

    }

    else if (
        designData.nameAlign ===
        "left"
    ) {

        name.style.transform =
            "translateX(-100%)";

    }


    canvas.appendChild(
        name
    );


    /*
       QR
    */

    const qr =
        document.createElement(
            "div"
        );


    qr.className =
        "guest-qr";


    qr.style.left =
        (
            designData.qrX *
            100
        ) + "%";


    qr.style.top =
        (
            designData.qrY *
            100
        ) + "%";


    qr.style.width =
        designData.qrSize +
        "px";


    qr.style.height =
        designData.qrSize +
        "px";


    /*
       صورة QR محلية
    */

    const qrImage =
        document.createElement(
            "img"
        );


    qrImage.alt =
        "QR";


    /*
       إنشاء QR من الكود الخاص
       بهذه الدعوة
    */

    createQRImage(
        invitation.qr_code,
        qrImage
    );


    qr.appendChild(
        qrImage
    );


    canvas.appendChild(
        qr
    );


    card.appendChild(
        canvas
    );


    /*
       زر تنزيل صورة واحدة
    */

    const downloadButton =
        document.createElement(
            "button"
        );


    downloadButton.innerText =
        "تنزيل هذه الدعوة";


    downloadButton.addEventListener(
        "click",
        function() {

            downloadSingleInvitation(
                canvas,
                invitation
            );

        }
    );


    card.appendChild(
        downloadButton
    );


    return card;

}


/* =========================
   إنشاء QR محلي
========================= */

function createQRImage(
    value,
    imageElement
) {

    if (
        !imageElement
    ) {

        return;

    }


    const qrValue =
        String(
            value ||
            "DEMO"
        );


    if (
        typeof QRCode ===
        "undefined"
    ) {

        console.error(
            "QRCode library not loaded."
        );

        return;

    }


    QRCode.toDataURL(

        qrValue,

        {

            width: 800,

            margin: 0,

            errorCorrectionLevel:
                "H",

            color: {

                dark:
                    designData.qrColor ||
                    "#000000",

                light:
                    "#ffffff"

            }

        },

        function(
            error,
            url
        ) {

            if (error) {

                console.error(
                    "QR CREATE ERROR:",
                    error
                );

                return;

            }


            imageElement.src =
                url;

        }

    );

}


/* =========================
   انتظار الصور
========================= */

function waitForImages(
    element
) {

    const images =
        Array.from(
            element.querySelectorAll(
                "img"
            )
        );


    return Promise.all(

        images.map(
            function(img) {

                if (
                    img.complete &&
                    img.naturalWidth > 0
                ) {

                    return Promise.resolve();

                }


                return new Promise(
                    function(resolve) {

                        img.onload =
                            resolve;

                        img.onerror =
                            resolve;

                    }
                );

            }
        )

    );

}


/* =========================
   تحويل الدعوة لصورة
========================= */

async function canvasToImage(
    element
) {

    await waitForImages(
        element
    );


    const canvas =
        await html2canvas(
            element,
            {

                scale: 2,

                useCORS: true,

                allowTaint: false,

                backgroundColor: null,

                logging: false,

                imageTimeout: 30000

            }
        );


    return canvas;

}


/* =========================
   تنزيل صورة واحدة
========================= */

async function downloadSingleInvitation(
    element,
    invitation
) {

    try {

        const canvas =
            await canvasToImage(
                element
            );


        const link =
            document.createElement(
                "a"
            );


        const name =
            safeFileName(
                invitation.guest_name ||
                `دعوة-${invitation.invitation_number || ""}`
            );


        link.download =
            `${name}.png`;


        link.href =
            canvas.toDataURL(
                "image/png"
            );


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();

    }

    catch (error) {

        console.error(error);

        showMessage(
            "تعذر تنزيل الدعوة كصورة.",
            "error"
        );

    }

}


/* =========================
   تنزيل جميع الصور
========================= */

document
    .getElementById(
        "downloadImagesButton"
    )
    .addEventListener(
        "click",
        downloadAllImages
    );


async function downloadAllImages() {

    const button =
        document.getElementById(
            "downloadImagesButton"
        );


    button.disabled =
        true;


    button.innerText =
        "جاري تجهيز الصور...";


    try {

        const cards =
            document.querySelectorAll(
                ".invitation-canvas"
            );


        for (
            let i = 0;
            i < cards.length;
            i++
        ) {

            const canvas =
                await canvasToImage(
                    cards[i]
                );


            const invitation =
                invitations[i];


            const link =
                document.createElement(
                    "a"
                );


            const name =
                safeFileName(
                    invitation.guest_name ||
                    `دعوة-${i + 1}`
                );


            link.download =
                `${name}.png`;


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            await wait(400);

        }


        showMessage(
            "تم تجهيز الدعوات كصور.",
            "success"
        );

    }

    catch (error) {

        console.error(error);

        showMessage(
            "حدث خطأ أثناء تنزيل الصور: " +
            error.message,
            "error"
        );

    }

    finally {

        button.disabled =
            false;

        button.innerText =
            "تنزيل الدعوات كصور";

    }

}


/* =========================
   PDF
========================= */

document
    .getElementById(
        "downloadPdfButton"
    )
    .addEventListener(
        "click",
        downloadPDF
    );


async function downloadPDF() {

    const button =
        document.getElementById(
            "downloadPdfButton"
        );


    button.disabled =
        true;


    button.innerText =
        "جاري إنشاء PDF...";


    try {

        if (
            !invitations.length
        ) {

            throw new Error(
                "لا توجد دعوات لإنشاء PDF."
            );

        }


        const {
            jsPDF
        } =
            window.jspdf;


        const elements =
            Array.from(
                document.querySelectorAll(
                    ".invitation-canvas"
                )
            );


        if (
            !elements.length
        ) {

            throw new Error(
                "لم يتم العثور على تصاميم الدعوات."
            );

        }


        /*
           أول صورة لتحديد حجم صفحة PDF
        */

        const firstCanvas =
            await canvasToImage(
                elements[0]
            );


        const firstWidth =
            firstCanvas.width;


        const firstHeight =
            firstCanvas.height;


        const orientation =
            firstHeight >
            firstWidth
                ? "portrait"
                : "landscape";


        const pdf =
            new jsPDF({

                orientation:
                    orientation,

                unit:
                    "px",

                format:
                    [
                        firstWidth,
                        firstHeight
                    ],

                compress:
                    true

            });


        /*
           إضافة كل دعوة في صفحة
        */

        for (
            let i = 0;
            i < elements.length;
            i++
        ) {

            const imageCanvas =
                i === 0
                    ? firstCanvas
                    : await canvasToImage(
                        elements[i]
                    );


            const imageWidth =
                imageCanvas.width;


            const imageHeight =
                imageCanvas.height;


            if (i > 0) {

                pdf.addPage(
                    [
                        imageWidth,
                        imageHeight
                    ],
                    imageHeight >
                    imageWidth
                        ? "portrait"
                        : "landscape"
                );

            }


            const imageData =
                imageCanvas.toDataURL(
                    "image/jpeg",
                    0.95
                );


            pdf.addImage(

                imageData,

                "JPEG",

                0,

                0,

                imageWidth,

                imageHeight,

                undefined,

                "FAST"

            );


            await wait(150);

        }


        const fileName =
            safeFileName(
                eventData.event_name ||
                "الدعوات"
            );


        pdf.save(
            fileName +
            ".pdf"
        );


        showMessage(
            "تم إنشاء ملف PDF بنجاح 🤍",
            "success"
        );

    }

    catch (error) {

        console.error(
            "PDF ERROR:",
            error
        );


        showMessage(
            "تعذر إنشاء PDF: " +
            error.message,
            "error"
        );

    }

    finally {

        button.disabled =
            false;

        button.innerText =
            "تنزيل جميع الدعوات PDF";

    }

}


/* =========================
   ZIP
========================= */

document
    .getElementById(
        "downloadZipButton"
    )
    .addEventListener(
        "click",
        downloadZIP
    );


async function downloadZIP() {

    const button =
        document.getElementById(
            "downloadZipButton"
        );


    button.disabled =
        true;


    button.innerText =
        "جاري إنشاء ZIP...";


    try {

        if (
            !invitations.length
        ) {

            throw new Error(
                "لا توجد دعوات لإنشاء ZIP."
            );

        }


        const zip =
            new JSZip();


        const folder =
            zip.folder(
                "الدعوات"
            );


        const elements =
            Array.from(
                document.querySelectorAll(
                    ".invitation-canvas"
                )
            );


        for (
            let i = 0;
            i < elements.length;
            i++
        ) {

            const canvas =
                await canvasToImage(
                    elements[i]
                );


            const invitation =
                invitations[i];


            const name =
                safeFileName(
                    invitation.guest_name ||
                    `دعوة-${i + 1}`
                );


            const blob =
                await new Promise(
                    function(resolve) {

                        canvas.toBlob(
                            resolve,
                            "image/png"
                        );

                    }
                );


            if (!blob) {

                throw new Error(
                    "تعذر تحويل الدعوة رقم " +
                    (i + 1) +
                    " إلى صورة."
                );

            }


            folder.file(
                `${name}.png`,
                blob
            );


            button.innerText =
                `جاري تجهيز ${i + 1} من ${elements.length}...`;


            await wait(100);

        }


        button.innerText =
            "جاري ضغط الملف...";


        const content =
            await zip.generateAsync(
                {
                    type: "blob",
                    compression:
                        "DEFLATE",
                    compressionOptions:
                        {
                            level: 6
                        }
                }
            );


        const url =
            URL.createObjectURL(
                content
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            safeFileName(
                eventData.event_name ||
                "الدعوات"
            ) +
            ".zip";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
            function() {

                URL.revokeObjectURL(
                    url
                );

            },
            1000
        );


        showMessage(
            "تم إنشاء ملف ZIP بنجاح 🤍",
            "success"
        );

    }

    catch (error) {

        console.error(
            "ZIP ERROR:",
            error
        );


        showMessage(
            "تعذر إنشاء ZIP: " +
            error.message,
            "error"
        );

    }

    finally {

        button.disabled =
            false;

        button.innerText =
            "تنزيل الدعوات ZIP";

    }

}


/* =========================
   حفظ الأكواد فقط
========================= */

document
    .getElementById(
        "downloadCodesButton"
    )
    .addEventListener(
        "click",
        downloadCodesOnly
    );


async function downloadCodesOnly() {

    const button =
        document.getElementById(
            "downloadCodesButton"
        );


    button.disabled =
        true;


    button.innerText =
        "جاري تجهيز الأكواد...";


    try {

        if (
            !invitations.length
        ) {

            throw new Error(
                "لا توجد أكواد لحفظها."
            );

        }


        let savedCount =
            0;


        for (
            let i = 0;
            i < invitations.length;
            i++
        ) {

            const invitation =
                invitations[i];


            if (
                !invitation.qr_code
            ) {

                continue;

            }


            /*
               إنشاء QR كـ Data URL
               بدون تصميم الدعوة
            */

            const qrDataUrl =
                await generateQRDataURL(
                    invitation.qr_code
                );


            const link =
                document.createElement(
                    "a"
                );


            const name =
                safeFileName(
                    invitation.guest_name ||
                    `كود-${invitation.invitation_number || i + 1}`
                );


            link.download =
                `${name}-QR.png`;


            link.href =
                qrDataUrl;


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            savedCount++;


            button.innerText =
                `جاري حفظ ${savedCount} من ${invitations.length}...`;


            await wait(300);

        }


        if (
            savedCount === 0
        ) {

            throw new Error(
                "لا توجد أكواد لحفظها."
            );

        }


        showMessage(
            `تم حفظ ${savedCount} كود كصور PNG بدون تصميم 🤍`,
            "success"
        );

    }

    catch (error) {

        console.error(
            "CODES ERROR:",
            error
        );


        showMessage(
            "تعذر حفظ الأكواد: " +
            error.message,
            "error"
        );

    }

    finally {

        button.disabled =
            false;

        button.innerText =
            "حفظ الأكواد فقط بدون تصميم";

    }

}


/* =========================
   إنشاء صورة QR للحفظ
========================= */

function generateQRDataURL(
    value
) {

    return new Promise(
        function(resolve, reject) {

            if (
                typeof QRCode ===
                "undefined"
            ) {

                reject(
                    new Error(
                        "لم يتم تحميل مكتبة QR."
                    )
                );

                return;

            }


            QRCode.toDataURL(

                String(value),

                {

                    width: 1200,

                    margin: 0,

                    errorCorrectionLevel:
                        "H",

                    color: {

                        dark:
                            designData.qrColor ||
                            "#000000",

                        light:
                            "#ffffff"

                    }

                },

                function(
                    error,
                    url
                ) {

                    if (error) {

                        reject(
                            error
                        );

                        return;

                    }


                    resolve(
                        url
                    );

                }

            );

        }
    );

}


/* =========================
   العودة للتصميم
========================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(

            window.location.href =

                );

    );


/* =========================
   اسم ملف آمن
========================= */

function safeFileName(
    name
) {

    return String(name)

        .replace(
            /[<>:"/\\|?*]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim()

        .substring(
            0,
            100
        )

        || "دعوة";

}


/* =========================
   انتظار
========================= */

function wait(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}


/* =========================
   إخفاء التحميل
========================= */

function hideLoading() {

    const loading =
        document.getElementById(
            "loading"
        );


    if (loading) {

        loading.style.display =
            "none";

    }

}


/* =========================
   الرسائل
========================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        "message " +
        type;

}
