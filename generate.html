<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>توليد الدعوات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f6f3;
    color: #222;
}

.container {
    max-width: 950px;
    margin: 40px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

h1 {
    text-align: center;
    margin: 0 0 8px;
}

.subtitle {
    text-align: center;
    color: #888;
    font-size: 14px;
    margin-bottom: 25px;
}


/* =========================
   المعلومات
========================= */

.info {
    background: #faf9f7;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid #eee;
}

.info-row:last-child {
    border-bottom: 0;
}


/* =========================
   زر عام
========================= */

button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: 0;
    border-radius: 11px;
    background: #222;
    color: white;
    font-size: 15px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.secondary {
    background: #777;
}


/* =========================
   منطقة المراجعة
========================= */

.review-area {
    display: none;
    margin-top: 25px;
}

.review-title {
    text-align: center;
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 15px;
}

.review-card {
    background: #eee;
    border-radius: 16px;
    padding: 15px;
    text-align: center;
}


/* =========================
   التصميم
========================= */

.invitation-canvas {
    position: relative;
    display: inline-block;
    max-width: 100%;
    line-height: 0;
    overflow: hidden;
    border-radius: 10px;
}

.invitation-canvas > img.background {
    display: block;
    width: 100%;
    height: auto;
}

.guest-name {
    position: absolute;
    white-space: nowrap;
    line-height: normal;
    z-index: 2;
}

.guest-qr {
    position: absolute;
    z-index: 3;
}

.guest-qr img {
    width: 100%;
    height: 100%;
    display: block;
}


/* =========================
   أزرار السابق والتالي
========================= */

.review-navigation {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 15px;
}

.review-navigation button {
    flex: 1;
    margin-top: 0;
}

.review-counter {
    min-width: 95px;
    text-align: center;
    font-weight: bold;
    font-size: 15px;
    color: #555;
}


/* =========================
   اسم الدعوة
========================= */

.current-guest {
    margin-top: 12px;
    font-weight: bold;
    font-size: 16px;
}


/* =========================
   الأزرار النهائية
========================= */

.actions {
    display: none;
    margin-top: 25px;
}


/* =========================
   تحميل
========================= */

.loading {
    text-align: center;
    padding: 35px;
    color: #888;
}

.message {
    text-align: center;
    margin-top: 15px;
    line-height: 1.7;
}

.success {
    color: #287a4b;
}

.error {
    color: #c0392b;
}


/* =========================
   الهاتف
========================= */

@media (max-width: 700px) {

    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .box {
        padding: 20px;
    }

    .review-navigation {
        gap: 8px;
    }

    .review-counter {
        min-width: 75px;
        font-size: 14px;
    }

}

</style>

</head>


<body>


<div class="container">

<div class="box">


<h1>
توليد الدعوات
</h1>


<div class="subtitle">
راجعي كل دعوة قبل التوليد والتأكد من الاسم والـ QR
</div>


<!-- =========================
     معلومات الحفل
========================= -->

<div
    id="eventInfo"
    class="info"
    style="display:none;">

    <div class="info-row">

        <span>
            اسم الحفل
        </span>

        <strong id="eventName">
            -
        </strong>

    </div>


    <div class="info-row">

        <span>
            عدد الدعوات
        </span>

        <strong id="invitationCount">
            -
        </strong>

    </div>

</div>


<!-- =========================
     التحميل
========================= -->

<div
    id="loading"
    class="loading">

    جاري تحميل الدعوات...

</div>


<!-- =========================
     منطقة المراجعة
========================= -->

<div
    id="reviewArea"
    class="review-area">

    <div class="review-title">
        مراجعة الدعوة
    </div>


    <div class="review-card">

        <div
            id="invitationCanvasWrapper">
        </div>


        <div
            id="currentGuest"
            class="current-guest">
        </div>


        <!-- أزرار السابق والتالي -->

        <div
            class="review-navigation">

            <button
                id="previousButton"
                type="button">

                ← السابق

            </button>


            <div
                id="reviewCounter"
                class="review-counter">

                0 من 0

            </div>


            <button
                id="nextButton"
                type="button">

                التالي →

            </button>

        </div>

    </div>

</div>


<!-- =========================
     أزرار التوليد
========================= -->

<div
    id="actions"
    class="actions">


    <button
        id="downloadImagesButton"
        type="button">

        تنزيل الدعوات كصور

    </button>


    <button
        id="downloadPdfButton"
        type="button">

        تنزيل جميع الدعوات PDF

    </button>


    <button
        id="downloadZipButton"
        type="button">

        تنزيل الدعوات ZIP

    </button>


    <button
        id="downloadCodesButton"
        type="button">

        حفظ الأكواد فقط بدون تصميم

    </button>


    <button
        id="backButton"
        class="secondary"
        type="button">

        العودة لتعديل التصميم

    </button>

</div>


<div
    id="message"
    class="message">
</div>


</div>

</div>


<script>

/* =========================
   الرابط
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const eventId =
    params.get("event_id");


/* =========================
   المتغيرات
========================= */

let eventData = null;

let invitations = [];

let designData = null;

let currentIndex = 0;


/* =========================
   تشغيل الصفحة
========================= */

document.addEventListener(
    "DOMContentLoaded",
    loadPage
);


async function loadPage() {

    if (!eventId) {

        hideLoading();

        showMessage(
            "رابط الحفل غير صحيح.",
            "error"
        );

        return;
    }


    try {

        await loadDesign();

        await loadEvent();

        await loadInvitations();


        if (!invitations.length) {

            hideLoading();

            showMessage(
                "لا توجد دعوات لهذا الحفل.",
                "error"
            );

            return;
        }


        currentIndex = 0;

        showCurrentInvitation();


        hideLoading();


        document.getElementById(
            "reviewArea"
        ).style.display = "block";


        document.getElementById(
            "actions"
        ).style.display = "block";

    }

    catch (error) {

        console.error(
            "GENERATE ERROR:",
            error
        );


        hideLoading();


        showMessage(
            error.message ||
            "حدث خطأ أثناء تحميل الدعوات.",
            "error"
        );

    }

}


/* =========================
   تحميل التصميم
========================= */

async function loadDesign() {

    const saved =
        localStorage.getItem(
            `invitation_design_${eventId}`
        );


    if (!saved) {

        throw new Error(
            "لم يتم العثور على التصميم المحفوظ. ارجعي إلى صفحة تصميم الدعوات واحفظي التصميم أولًا."
        );

    }


    try {

        designData =
            JSON.parse(saved);

    }

    catch (error) {

        throw new Error(
            "بيانات التصميم المحفوظة غير صالحة."
        );

    }


    if (
        !designData ||
        !designData.image
    ) {

        throw new Error(
            "صورة التصميم غير موجودة."
        );

    }


    /* القيم الافتراضية */

    designData.nameX =
        Number(
            designData.nameX ?? 0.5
        );


    designData.nameY =
        Number(
            designData.nameY ?? 0.5
        );


    designData.qrX =
        Number(
            designData.qrX ?? 0.75
        );


    designData.qrY =
        Number(
            designData.qrY ?? 0.75
        );


    designData.nameSize =
        Number(
            designData.nameSize ?? 22
        );


    designData.qrSize =
        Number(
            designData.qrSize ?? 110
        );


    designData.nameFont =
        designData.nameFont ||
        "Arial";


    designData.nameAlign =
        designData.nameAlign ||
        "center";


    designData.qrAlign =
        designData.qrAlign ||
        "center";


    designData.nameColor =
        designData.nameColor ||
        "#222222";


    designData.qrColor =
        designData.qrColor ||
        "#000000";

}


/* =========================
   تحميل الحفل
========================= */

async function loadEvent() {

    if (
        typeof supabaseClient ===
        "undefined"
    ) {

        throw new Error(
            "لم يتم تحميل Supabase. تأكدي من ملف config.js."
        );

    }


    const {
        data,
        error
    } =
        await supabaseClient

        .from("events")

        .select("*")

        .eq(
            "id",
            eventId
        )

        .single();


    if (error) {

        throw new Error(
            "تعذر تحميل بيانات الحفل: " +
            error.message
        );

    }


    if (!data) {

        throw new Error(
            "لم يتم العثور على الحفل."
        );

    }


    eventData =
        data;


    document.getElementById(
        "eventName"
    ).innerText =
        data.event_name || "-";


    document.getElementById(
        "eventInfo"
    ).style.display =
        "block";

}


/* =========================
   تحميل الدعوات
========================= */

async function loadInvitations() {

    const {
        data,
        error
    } =
        await supabaseClient

        .from("invitations")

        .select("*")

        .eq(
            "event_id",
            eventId
        )

        .order(
            "invitation_number",
            {
                ascending: true
            }
        );


    if (error) {

        throw new Error(
            "تعذر تحميل الدعوات: " +
            error.message
        );

    }


    invitations =
        data || [];


    document.getElementById(
        "invitationCount"
    ).innerText =
        invitations.length;

}


/* =========================
   عرض الدعوة الحالية
========================= */

function showCurrentInvitation() {

    if (
        !invitations.length
    ) {

        return;

    }


    if (
        currentIndex < 0
    ) {

        currentIndex = 0;

    }


    if (
        currentIndex >=
        invitations.length
    ) {

        currentIndex =
            invitations.length - 1;

    }


    const invitation =
        invitations[currentIndex];


    const wrapper =
        document.getElementById(
            "invitationCanvasWrapper"
        );


    wrapper.innerHTML =
        "";


    const canvas =
        createInvitationCanvas(
            invitation
        );


    wrapper.appendChild(
        canvas
    );


    document.getElementById(
        "currentGuest"
    ).innerText =
        invitation.guest_name ||
        "اسم المدعو";


    document.getElementById(
        "reviewCounter"
    ).innerText =
        `${currentIndex + 1} من ${invitations.length}`;


    updateNavigationButtons();

}


/* =========================
   أزرار السابق والتالي
========================= */

document
    .getElementById(
        "previousButton"
    )
    .addEventListener(
        "click",
        function() {

            if (
                currentIndex > 0
            ) {

                currentIndex--;

                showCurrentInvitation();

            }

        }
    );


document
    .getElementById(
        "nextButton"
    )
    .addEventListener(
        "click",
        function() {

            if (
                currentIndex <
                invitations.length - 1
            ) {

                currentIndex++;

                showCurrentInvitation();

            }

        }
    );


function updateNavigationButtons() {

    const previous =
        document.getElementById(
            "previousButton"
        );


    const next =
        document.getElementById(
            "nextButton"
        );


    previous.disabled =
        currentIndex === 0;


    next.disabled =
        currentIndex ===
        invitations.length - 1;

}


/* =========================
   إنشاء الدعوة
========================= */

function createInvitationCanvas(
    invitation
) {

    const canvas =
        document.createElement(
            "div"
        );


    canvas.className =
        "invitation-canvas";


    canvas.dataset.invitationIndex =
        invitations.indexOf(
            invitation
        );


    /* =====================
       الخلفية
    ===================== */

    const background =
        document.createElement(
            "img"
        );


    background.className =
        "background";


    background.src =
        designData.image;


    background.crossOrigin =
        "anonymous";


    canvas.appendChild(
        background
    );


    /* =====================
       الاسم
    ===================== */

    const name =
        document.createElement(
            "div"
        );


    name.className =
        "guest-name";


    name.innerText =
        invitation.guest_name ||
        "اسم المدعو";


    name.style.left =
        (
            designData.nameX * 100
        ) + "%";


    name.style.top =
        (
            designData.nameY * 100
        ) + "%";


    name.style.fontSize =
        designData.nameSize +
        "px";


    name.style.fontFamily =
        designData.nameFont;


    name.style.color =
        designData.nameColor;


    name.style.textAlign =
        designData.nameAlign;


    /*
       المحاذاة الأفقية
    */

    if (
        designData.nameAlign ===
        "center"
    ) {

        name.style.transform =
            "translateX(-50%)";

    }

    else if (
        designData.nameAlign ===
        "left"
    ) {

        name.style.transform =
            "translateX(-100%)";

    }

    else {

        name.style.transform =
            "translateX(0)";

    }


    canvas.appendChild(
        name
    );


    /* =====================
       QR
    ===================== */

    const qr =
        document.createElement(
            "div"
        );


    qr.className =
        "guest-qr";


    qr.style.left =
        (
            designData.qrX * 100
        ) + "%";


    qr.style.top =
        (
            designData.qrY * 100
        ) + "%";


    qr.style.width =
        designData.qrSize +
        "px";


    qr.style.height =
        designData.qrSize +
        "px";


    /*
       محاذاة QR
    */

    if (
        designData.qrAlign ===
        "center"
    ) {

        qr.style.transform =
            "translateX(-50%)";

    }

    else if (
        designData.qrAlign ===
        "left"
    ) {

        qr.style.transform =
            "translateX(-100%)";

    }

    else {

        qr.style.transform =
            "translateX(0)";

    }


    const qrImage =
        document.createElement(
            "img"
        );


    qrImage.alt =
        "QR";


    createQRImage(
        invitation.qr_code,
        qrImage
    );


    qr.appendChild(
        qrImage
    );


    canvas.appendChild(
        qr
    );


    return canvas;

}


/* =========================
   إنشاء QR
========================= */

function createQRImage(
    value,
    imageElement
) {

    if (
        typeof QRCode ===
        "undefined"
    ) {

        console.error(
            "QRCode library not loaded."
        );

        return;

    }


    const qrValue =
        String(
            value || "DEMO"
        );


    QRCode.toDataURL(

        qrValue,

        {

            width: 800,

            margin: 0,

            errorCorrectionLevel:
                "H",

            color: {

                dark:
                    designData.qrColor ||
                    "#000000",

                light:
                    "#ffffff"

            }

        },

        function(
            error,
            url
        ) {

            if (error) {

                console.error(
                    "QR ERROR:",
                    error
                );

                return;

            }


            imageElement.src =
                url;

        }

    );

}


/* =========================
   انتظار الصور
========================= */

function waitForImages(
    element
) {

    const images =
        Array.from(
            element.querySelectorAll(
                "img"
            )
        );


    return Promise.all(

        images.map(
            function(img) {

                if (
                    img.complete &&
                    img.naturalWidth > 0
                ) {

                    return Promise.resolve();

                }


                return new Promise(
                    function(resolve) {

                        img.onload =
                            resolve;

                        img.onerror =
                            resolve;

                    }
                );

            }
        )

    );

}


/* =========================
   تحويل الدعوة لصورة
========================= */

async function canvasToImage(
    element
) {

    await waitForImages(
        element
    );


    const canvas =
        await html2canvas(
            element,
            {

                scale: 2,

                useCORS: true,

                allowTaint: false,

                backgroundColor: null,

                logging: false,

                imageTimeout: 30000

            }
        );


    return canvas;

}


/* =========================
   تنزيل دعوة واحدة
========================= */

async function downloadSingleInvitation(
    element,
    invitation
) {

    const canvas =
        await canvasToImage(
            element
        );


    const link =
        document.createElement(
            "a"
        );


    const name =
        safeFileName(
            invitation.guest_name ||
            "دعوة"
        );


    link.download =
        `${name}.png`;


    link.href =
        canvas.toDataURL(
            "image/png"
        );


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();

}


/* =========================
   تنزيل جميع الصور
========================= */

document
    .getElementById(
        "downloadImagesButton"
    )
    .addEventListener(
        "click",
        downloadAllImages
    );


async function downloadAllImages() {

    const button =
        document.getElementById(
            "downloadImagesButton"
        );


    button.disabled =
        true;


    button.innerText =
        "جاري تجهيز الصور...";


    try {

        for (
            let i = 0;
            i < invitations.length;
            i++
        ) {

            const temp =
                createInvitationCanvas(
                    invitations[i]
                );


            temp.style.position =
                "fixed";

            temp.style.left =
                "-10000px";

            temp.style.top =
                "0";


            document.body.appendChild(
                temp
            );


            const canvas =
                await canvasToImage(
                    temp
                );


            const link =
                document.createElement(
                    "a"
                );


            const name =
                safeFileName(
                    invitations[i].guest_name ||
                    `دعوة-${i + 1}`
                );


            link.download =
                `${name}.png`;


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();

            temp.remove();


            button.innerText =
                `جاري تجهيز ${i + 1} من ${invitations.length}...`;


            await wait(300);

        }


        showMessage(
            "تم تجهيز الدعوات كصور 🤍",
            "success"
        );

    }

    catch (error) {

        console.error(error);

        showMessage(
            "حدث خطأ أثناء تنزيل الصور: " +
            error.message,
            "error"
        );

    }

    finally {

        button.disabled =
            false;

        button.innerText =
            "تنزيل الدعوات كصور";

    }

}


/* =========================
   PDF
========================= */

document
    .getElementById(
        "downloadPdfButton"
    )
    .addEventListener(
        "click",
        downloadPDF
    );


async function downloadPDF() {

    const button =
        document.getElementById(
            "downloadPdfButton"
        );


    button.disabled =
        true;


    button.innerText =
        "جاري إنشاء PDF...";


    try {

        const {
            jsPDF
        } =
            window.jspdf;


        let firstCanvas =
            null;


        let firstWidth = 0;

        let firstHeight = 0;


        for (
            let i = 0;
            i < invitations.length;
            i++
        ) {

            const temp =
                createInvitationCanvas(
                    invitations[i]
                );


            temp.style.position =
                "fixed";

            temp.style.left =
                "-10000px";

            temp.style.top =
                "0";


            document.body.appendChild(
                temp
            );


            const imageCanvas =
                await canvasToImage(
                    temp
                );


            temp.remove();


            if (i === 0) {

                firstCanvas =
                    imageCanvas;

                firstWidth =
                    imageCanvas.width;

                firstHeight =
                    imageCanvas.height;

            }

        }


        const orientation =
            firstHeight >
            firstWidth
                ? "portrait"
                : "landscape";


        const pdf =
            new jsPDF({

                orientation:
                    orientation,

                unit:
                    "px",

                format:
                    [
                        firstWidth,
                        firstHeight
                    ],

                compress:
                    true

            });


        /*
           نعيد إنشاء كل دعوة
        */

        for (
            let i = 0;
            i < invitations.length;
            i++
        ) {

            const temp =
                createInvitationCanvas(
                    invitations[i]
                );


            temp.style.position =
                "fixed";

            temp.style.left =
                "-10000px";

            temp.style.top =
                "0";


            document.body.appendChild(
                temp
            );


            const imageCanvas =
                await canvasToImage(
                    temp
                );


            temp.remove();


            if (i > 0) {

                pdf.addPage(

                    [
                        imageCanvas.width,
                        imageCanvas.height
                    ],

                    imageCanvas.height >
                    imageCanvas.width
                        ? "portrait"
                        : "landscape"

                );

            }


            pdf.addImage(

                imageCanvas.toDataURL(
                    "image/jpeg",
                    0.95
                ),

                "JPEG",

                0,

                0,

                imageCanvas.width,

                imageCanvas.height,

                undefined,

                "FAST"

            );

        }


        pdf.save(
            safeFileName(
                eventData.event_name ||
                "الدعوات"
            ) +
            ".pdf"
        );


        showMessage(
            "تم إنشاء ملف PDF بنجاح 🤍",
            "success"
        );

    }

    catch (error) {

        console.error(
            "PDF ERROR:",
            error
        );


        showMessage(
            "تعذر إنشاء PDF: " +
            error.message,
            "error"
        );

    }

    finally {

        button.disabled =
            false;

        button.innerText =
            "تنزيل جميع الدعوات PDF";

    }

}


/* =========================
   ZIP
========================= */

document
    .getElementById(
        "downloadZipButton"
    )
    .addEventListener(
        "click",
        downloadZIP
    );


async function downloadZIP() {

    const button =
        document.getElementById(
            "downloadZipButton"
        );


    button.disabled =
        true;


    try {

        const zip =
            new JSZip();


        const folder =
            zip.folder(
                "الدعوات"
            );


        for (
            let i = 0;
            i < invitations.length;
            i++
        ) {

            const temp =
                createInvitationCanvas(
                    invitations[i]
                );


            temp.style.position =
                "fixed";

            temp.style.left =
                "-10000px";

            temp.style.top =
                "0";


            document.body.appendChild(
                temp
            );


            const canvas =
                await canvasToImage(
                    temp
                );


            temp.remove();


            const blob =
                await new Promise(
                    function(resolve) {

                        canvas.toBlob(
                            resolve,
                            "image/png"
                        );

                    }
                );


            folder.file(
                safeFileName(
                    invitations[i].guest_name ||
                    `دعوة-${i + 1}`
                ) +
                ".png",
                blob
            );


            button.innerText =
                `جاري تجهيز ${i + 1} من ${invitations.length}...`;

        }


        button.innerText =
            "جاري ضغط الملف...";


        const content =
            await zip.generateAsync(
                {
                    type: "blob"
                }
            );


        const url =
            URL.createObjectURL(
                content
            );


        const link =
            document.createElement(
                "a"
            );


        link.href =
            url;


        link.download =
            safeFileName(
                eventData.event_name ||
                "الدعوات"
            ) +
            ".zip";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        URL.revokeObjectURL(
            url
        );


        showMessage(
            "تم إنشاء ملف ZIP بنجاح 🤍",
            "success"
        );

    }

    catch (error) {

        console.error(
            "ZIP ERROR:",
            error
        );


        showMessage(
            "تعذر إنشاء ZIP: " +
            error.message,
            "error"
        );

    }

    finally {

        button.disabled =
            false;

        button.innerText =
            "تنزيل الدعوات ZIP";

    }

}


/* =========================
   حفظ الأكواد فقط
========================= */

document
    .getElementById(
        "downloadCodesButton"
    )
    .addEventListener(
        "click",
        downloadCodesOnly
    );


async function downloadCodesOnly() {

    const button =
        document.getElementById(
            "downloadCodesButton"
        );


    button.disabled =
        true;


    try {

        for (
            let i = 0;
            i < invitations.length;
            i++
        ) {

            const invitation =
                invitations[i];


            if (
                !invitation.qr_code
            ) {

                continue;

            }


            const qrDataUrl =
                await generateQRDataURL(
                    invitation.qr_code
                );


            const link =
                document.createElement(
                    "a"
                );


            link.download =
                safeFileName(
                    invitation.guest_name ||
                    `كود-${i + 1}`
                ) +
                "-QR.png";


            link.href =
                qrDataUrl;


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            button.innerText =
                `جاري حفظ ${i + 1} من ${invitations.length}...`;


            await wait(300);

        }


        showMessage(
            "تم حفظ الأكواد كصور PNG 🤍",
            "success"
        );

    }

    catch (error) {

        console.error(error);

        showMessage(
            "تعذر حفظ الأكواد: " +
            error.message,
            "error"
        );

    }

    finally {

        button.disabled =
            false;

        button.innerText =
            "حفظ الأكواد فقط بدون تصميم";

    }

}


/* =========================
   QR Data URL
========================= */

function generateQRDataURL(
    value
) {

    return new Promise(
        function(resolve, reject) {

            QRCode.toDataURL(

                String(value),

                {

                    width: 1200,

                    margin: 0,

                    errorCorrectionLevel:
                        "H",

                    color: {

                        dark:
                            designData.qrColor ||
                            "#000000",

                        light:
                            "#ffffff"

                    }

                },

                function(
                    error,
                    url
                ) {

                    if (error) {

                        reject(error);

                        return;

                    }


                    resolve(url);

                }

            );

        }
    );

}


/* =========================
   العودة للتصميم
========================= */

document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        function() {

            window.location.href =
                "design.html?event_id=" +
                encodeURIComponent(
                    eventId
                );

        }
    );


/* =========================
   اسم ملف آمن
========================= */

function safeFileName(
    name
) {

    return String(name)

        .replace(
            /[<>:"/\\|?*]/g,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim()

        .substring(
            0,
            100
        )

        ||
        "دعوة";

}


/* =========================
   انتظار
========================= */

function wait(
    milliseconds
) {

    return new Promise(
        function(resolve) {

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}


/* =========================
   إخفاء التحميل
========================= */

function hideLoading() {

    const loading =
        document.getElementById(
            "loading"
        );


    if (loading) {

        loading.style.display =
            "none";

    }

}


/* =========================
   الرسائل
========================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );


    message.innerText =
        text;


    message.className =
        "message " +
        (type || "");

}
