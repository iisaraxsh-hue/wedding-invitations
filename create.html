```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>إنشاء الدعوات</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f8f6f3;
    color: #222;
}

.container {
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
}

.box {
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
}

h1 {
    text-align: center;
    margin-top: 0;
    margin-bottom: 30px;
}

label {
    display: block;
    margin-top: 18px;
    margin-bottom: 8px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
    background: white;
}

input:focus,
select:focus {
    outline: none;
    border-color: #888;
}

.hint {
    margin-top: 7px;
    color: #888;
    font-size: 13px;
    line-height: 1.6;
}

button {
    width: 100%;
    margin-top: 30px;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.message {
    text-align: center;
    margin-top: 18px;
    line-height: 1.7;
}

.error {
    color: #c0392b;
}

.success {
    color: #287a4b;
}

@media (max-width: 600px) {

    .container {
        margin: 15px auto;
        padding: 12px;
    }

    .box {
        padding: 22px;
    }
}
</style>

</head>

<body>

<div class="container">

<div class="box">

<h1>إنشاء دعوة</h1>

<!-- اسم الحفل -->

<label>
اسم الحفل
</label>

<input
    id="eventName"
    type="text"
    placeholder="مثال: حفل زفاف سارة"
>


<!-- تاريخ الحفل -->

<label>
تاريخ الحفل
</label>

<input
    id="eventDate"
    type="date"
>


<!-- بداية الدخول -->

<label>
وقت بداية الدخول
</label>

<input
    id="startTime"
    type="time"
>


<!-- نهاية الدخول -->

<label>
وقت انتهاء الدخول
</label>

<input
    id="endTime"
    type="time"
>


<!-- عدد الدعوات -->

<label>
عدد الدعوات
</label>

<input
    id="invitationCount"
    type="number"
    min="1"
    step="1"
    placeholder="مثال: 100"
>

<div class="hint">
اكتبي العدد الإجمالي للدعوات التي تريدين إنشاءها.
</div>


<!-- المرافقين -->

<label>
عدد المرافقين الافتراضي
</label>

<input
    id="defaultCompanionCount"
    type="number"
    min="0"
    step="1"
    value="0"
    placeholder="0"
>

<div class="hint">
هذا الخيار اختياري. يمكنك تركه 0 ثم تحديد المرافقين لكل مدعو لاحقًا بشكل منفصل.
</div>


<!-- زر التوليد -->

<button
    id="generateButton"
    type="button">

توليد الدعوات

</button>


<div
    id="message"
    class="message">
</div>

</div>

</div>


<script>

/* =========================
   بدء الزر
========================= */

document
    .getElementById("generateButton")
    .addEventListener(
        "click",
        createEvent
    );


/* =========================
   إنشاء الحفل
========================= */

async function createEvent() {

    const button =
        document.getElementById(
            "generateButton"
        );

    button.disabled = true;

    button.innerText =
        "جاري إنشاء الدعوات...";


    try {

        /* =========================
           قراءة البيانات
        ========================= */

        const eventName =
            document
                .getElementById("eventName")
                .value
                .trim();


        const eventDate =
            document
                .getElementById("eventDate")
                .value;


        const startTime =
            document
                .getElementById("startTime")
                .value;


        const endTime =
            document
                .getElementById("endTime")
                .value;


        const invitationCount =
            Number(
                document
                    .getElementById(
                        "invitationCount"
                    )
                    .value
            );


        const defaultCompanionCount =
            Number(
                document
                    .getElementById(
                        "defaultCompanionCount"
                    )
                    .value || 0
            );


        /* =========================
           التحقق
        ========================= */

        if (!eventName) {

            showMessage(
                "فضلاً اكتبي اسم الحفل.",
                "error"
            );

            return;
        }


        if (!eventDate) {

            showMessage(
                "فضلاً اختاري تاريخ الحفل.",
                "error"
            );

            return;
        }


        if (!startTime) {

            showMessage(
                "فضلاً اختاري وقت بداية الدخول.",
                "error"
            );

            return;
        }


        if (!endTime) {

            showMessage(
                "فضلاً اختاري وقت انتهاء الدخول.",
                "error"
            );

            return;
        }


        if (
            !Number.isInteger(
                invitationCount
            ) ||
            invitationCount < 1
        ) {

            showMessage(
                "فضلاً اكتبي عدد الدعوات.",
                "error"
            );

            return;
        }


        if (
            !Number.isInteger(
                defaultCompanionCount
            ) ||
            defaultCompanionCount < 0
        ) {

            showMessage(
                "عدد المرافقين يجب أن يكون 0 أو أكثر.",
                "error"
            );

            return;
        }


        /* =========================
           إنشاء الحفل
        ========================= */

        const {
            data: event,
            error: eventError
        } =
            await supabaseClient

                .from("events")

                .insert({

                    event_name:
                        eventName,

                    event_date:
                        eventDate,

                    start_time:
                        startTime,

                    end_time:
                        endTime,

                    invitation_count:
                        invitationCount

                })

                .select()

                .single();


        if (eventError) {

            console.error(
                "Event error:",
                eventError
            );

            showMessage(
                "حدث خطأ أثناء إنشاء الحفل.",
                "error"
            );

            return;
        }


        /* =========================
           إنشاء الدعوات
        ========================= */

        const invitations = [];


        for (
            let i = 1;
            i <= invitationCount;
            i++
        ) {

            invitations.push({

                event_id:
                    event.id,

                guest_name:
                    null,

                invitation_number:
                    i,

                /*
                   عدد الأشخاص في الدعوة:
                   المدعو نفسه + المرافقين
                */

                guest_count:
                    1 +
                    defaultCompanionCount,

                checked_in:
                    0,

                qr_code:
                    crypto.randomUUID(),

                used:
                    false

            });

        }


        /* =========================
           حفظ الدعوات
        ========================= */

        const {
            error: invitationsError
        } =
            await supabaseClient

                .from("invitations")

                .insert(
                    invitations
                );


        if (invitationsError) {

            console.error(
                "Invitations error:",
                invitationsError
            );

            showMessage(
                "تم إنشاء الحفل لكن حدث خطأ أثناء إنشاء الدعوات.",
                "error"
            );

            return;
        }


        /* =========================
           نجاح
        ========================= */

        showMessage(
            `تم إنشاء ${invitationCount} دعوة بنجاح 🎉`,
            "success"
        );


        setTimeout(
            function() {

                window.location.href =
                    `invitations.html?event_id=${encodeURIComponent(event.id)}`;

            },
            700
        );


    }

    catch (error) {

        console.error(error);

        showMessage(
            "حدث خطأ غير متوقع ❌",
            "error"
        );

    }

    finally {

        button.disabled = false;

        button.innerText =
            "توليد الدعوات";

    }

}


/* =========================
   الرسائل
========================= */

function showMessage(
    text,
    type
) {

    const message =
        document.getElementById(
            "message"
        );

    message.innerText =
        text;

    message.className =
        "message " + type;

}

</script>

</body>

</html>
```
