```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>إنشاء الدعوات</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f6f3;
            color: #222;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }

        .box {
            background: white;
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.06);
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            background: white;
        }

        input:focus {
            outline: none;
            border-color: #888;
        }

        .hint {
            margin-top: 7px;
            color: #888;
            font-size: 13px;
            line-height: 1.6;
        }

        button {
            width: 100%;
            margin-top: 30px;
            padding: 16px;
            border: 0;
            border-radius: 12px;
            background: #222;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

    </style>

</head>


<body>


<div class="container">

    <div class="box">

        <h1>إنشاء دعوة</h1>


        <!-- اسم الحفل -->

        <label>
            اسم الحفل
        </label>

        <input
            id="eventName"
            type="text"
            placeholder="مثال: حفل زفاف سارة"
        >


        <!-- تاريخ الحفل -->

        <label>
            تاريخ الحفل
        </label>

        <input
            id="eventDate"
            type="date"
        >


        <!-- بداية الدخول -->

        <label>
            وقت بداية الدخول
        </label>

        <input
            id="startTime"
            type="time"
        >


        <!-- نهاية الدخول -->

        <label>
            وقت انتهاء الدخول
        </label>

        <input
            id="endTime"
            type="time"
        >


        <!-- عدد الدعوات -->

        <label>
            عدد الدعوات المطلوبة
        </label>

        <input
            id="invitationCount"
            type="number"
            min="1"
            step="1"
            placeholder="مثال: 100"
        >


        <!-- عدد المرافقين -->

        <label>
            عدد المرافقين
        </label>

        <input
            id="defaultCompanionCount"
            type="number"
            min="0"
            max="3"
            step="1"
            value="0"
            placeholder="0"
        >

        <div class="hint">
            اتركي العدد 0 إذا كانت الدعوة للمدعو فقط.
        </div>


        <!-- زر التوليد -->

        <button
            id="generateButton"
            type="button">

            توليد الدعوات

        </button>

    </div>

</div>


<script>


/* =========================
   زر التوليد
========================= */

document
    .getElementById("generateButton")
    .addEventListener(
        "click",
        createEvent
    );


/* =========================
   إنشاء الحفل
========================= */

async function createEvent() {

    const button =
        document.getElementById(
            "generateButton"
        );


    button.disabled = true;

    button.innerText =
        "جاري إنشاء الدعوات...";


    try {


        /* =========================
           قراءة البيانات
        ========================= */

        const eventName =
            document
                .getElementById("eventName")
                .value
                .trim();


        const eventDate =
            document
                .getElementById("eventDate")
                .value;


        const startTime =
            document
                .getElementById("startTime")
                .value;


        const endTime =
            document
                .getElementById("endTime")
                .value;


        const invitationCount =
            Number(
                document
                    .getElementById(
                        "invitationCount"
                    )
                    .value
            );


        const defaultCompanionCount =
            Number(
                document
                    .getElementById(
                        "defaultCompanionCount"
                    )
                    .value || 0
            );


        /* =========================
           التحقق
        ========================= */

        if (!eventName) {

            alert(
                "فضلاً اكتبي اسم الحفل"
            );

            return;
        }


        if (!eventDate) {

            alert(
                "فضلاً اختاري تاريخ الحفل"
            );

            return;
        }


        if (!startTime) {

            alert(
                "فضلاً اختاري وقت بداية الدخول"
            );

            return;
        }


        if (!endTime) {

            alert(
                "فضلاً اختاري وقت انتهاء الدخول"
            );

            return;
        }


        if (
            !Number.isInteger(
                invitationCount
            ) ||
            invitationCount < 1
        ) {

            alert(
                "فضلاً اكتبي عدد الدعوات"
            );

            return;
        }


        if (
            !Number.isInteger(
                defaultCompanionCount
            ) ||
            defaultCompanionCount < 0 ||
            defaultCompanionCount > 3
        ) {

            alert(
                "عدد المرافقين يجب أن يكون من 0 إلى 3 فقط"
            );

            return;
        }


        /* =========================
           إنشاء الحفل
        ========================= */

        const {
            data: event,
            error: eventError
        } =
            await supabaseClient

                .from("events")

                .insert({

                    event_name:
                        eventName,

                    event_date:
                        eventDate,

                    start_time:
                        startTime,

                    end_time:
                        endTime,

                    invitation_count:
                        invitationCount

                })

                .select()

                .single();


        if (eventError) {

            console.error(
                "Event error:",
                eventError
            );

            alert(
                "حدث خطأ أثناء إنشاء الحفل"
            );

            return;
        }


        /* =========================
           إنشاء الدعوات
        ========================= */

        const invitations = [];


        const totalAllowed =
            1 +
            defaultCompanionCount;


        for (
            let i = 1;
            i <= invitationCount;
            i++
        ) {

            invitations.push({

                event_id:
                    event.id,

                guest_name:
                    null,

                invitation_number:
                    i,

                guest_count:
                    totalAllowed,

                checked_in:
                    0,

                qr_code:
                    crypto.randomUUID(),

                used:
                    false

            });

        }


        /* =========================
           حفظ الدعوات
        ========================= */

        const {
            error: invitationsError
        } =
            await supabaseClient

                .from("invitations")

                .insert(
                    invitations
                );


        if (invitationsError) {

            console.error(
                "Invitations error:",
                invitationsError
            );

            alert(
                "تم إنشاء الحفل لكن حدث خطأ في إنشاء الدعوات"
            );

            return;
        }


        /* =========================
           نجاح
        ========================= */

        alert(
            `تم إنشاء الحفل وتوليد ${invitationCount} دعوة 🎉`
        );


        window.location.href =
            `invitations.html?event_id=${event.id}`;


    } catch (error) {

        console.error(error);

        alert(
            "حدث خطأ غير متوقع ❌"
        );

    } finally {

        button.disabled = false;

        button.innerText =
            "توليد الدعوات";

    }

}

</script>

</body>

</html>
```
