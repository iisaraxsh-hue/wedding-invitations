<body>


<div class="box">

    <h1>
        التحقق من الدعوة 🎟️
    </h1>

    <div id="content">

        <p class="loading">
            جاري التحقق من الدعوة...
        </p>

    </div>

</div>


<script>


let invitation = null;

let countdownTimer = null;


/* =========================================
   تحميل الدعوة
========================================= */

async function loadInvitation() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const code =
        params.get("code");


    if (!code) {

        showError(
            "عذرًا، هذا الكود غير صحيح<br>" +
            "يرجى التحقق من الكود."
        );

        return;
    }


    const {
        data,
        error
    } = await supabaseClient

        .from("invitations")

        .select(`
            *,
            events (
                event_name,
                event_date,
                start_time,
                end_time
            )
        `)

        .eq("qr_code", code)

        .single();


    if (error || !data) {

        console.error(error);

        showError(
            "عذرًا، هذا الكود غير صحيح<br>" +
            "يرجى التحقق من الكود."
        );

        return;
    }


    invitation = data;


    checkEventTime();

}


/* =========================================
   التحقق من وقت الدخول
========================================= */

function checkEventTime() {

    if (
        !invitation ||
        !invitation.events
    ) {

        showError(
            "تعذر العثور على بيانات المناسبة."
        );

        return;
    }


    const event =
        invitation.events;


    const start =
        new Date(
            `${event.event_date}T${event.start_time}`
        );


    const end =
        new Date(
            `${event.event_date}T${event.end_time}`
        );


    const now =
        new Date();


    /*
       قبل بداية الدخول
    */

    if (now < start) {

        showBeforeMessage(start);

        return;
    }


    /*
       بعد انتهاء الدخول
    */

    if (now >= end) {

        showAfterMessage();

        return;
    }


    /*
       داخل وقت الدخول
    */

    showDuringMessage();

}


/* =========================================
   قبل بداية الدخول
========================================= */

function showBeforeMessage(start) {

    clearInterval(countdownTimer);


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="message warning">
            أهلًا بك 🤍
        </div>

        <div class="sub-message">
            موعدنا لم يحن بعد، ننتظرك في الوقت المحدد ✨
        </div>

        <div
            id="countdown"
            class="countdown warning">
        </div>

    `;


    updateCountdown(start);


    countdownTimer =
        setInterval(
            () => {

                updateCountdown(start);

            },
            1000
        );

}


/* =========================================
   العداد
========================================= */

function updateCountdown(start) {

    const countdown =
        document.getElementById(
            "countdown"
        );


    if (!countdown) {
        return;
    }


    const now =
        new Date();


    const difference =
        start - now;


    if (difference <= 0) {

        clearInterval(
            countdownTimer
        );

        checkEventTime();

        return;
    }


    const hours =
        Math.floor(
            difference /
            (1000 * 60 * 60)
        );


    const minutes =
        Math.floor(
            (
                difference %
                (1000 * 60 * 60)
            ) /
            (1000 * 60)
        );


    const seconds =
        Math.floor(
            (
                difference %
                (1000 * 60)
            ) /
            1000
        );


    countdown.innerHTML =
        `${hours} ساعة ${minutes} دقيقة ${seconds} ثانية`;

}


/* =========================================
   أثناء وقت الدخول
========================================= */

function showDuringMessage() {

    clearInterval(
        countdownTimer
    );


    const allowed =
        Number(
            invitation.guest_count || 0
        );


    const checkedIn =
        Number(
            invitation.checked_in || 0
        );


    const remaining =
        Math.max(
            allowed - checkedIn,
            0
        );


    /*
       إذا اكتمل العدد
       يتم رفض أي دخول إضافي
    */

    if (
        invitation.used === true ||
        remaining <= 0
    ) {

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="message danger">
                تم اكتمال عدد الدخول
            </div>

            <div class="sub-message">
                عذرًا، تم استخدام العدد المسموح
                لهذه الدعوة بالكامل.
            </div>

        `;

        return;
    }


    const guestName =
        invitation.guest_name &&
        invitation.guest_name !== "مدعو"

            ? invitation.guest_name

            : "مدعو";


    const eventName =
        invitation.events.event_name || "";


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="guest-name">
            ${escapeHtml(guestName)}
        </div>

        <div class="event-name">
            ${escapeHtml(eventName)}
        </div>

        <div class="message success">
            يا هلا ومرحبًا 🤍
        </div>

        <div class="sub-message">
            سعداء بحضورك، تم تأكيد دعوتك بنجاح
        </div>

        <div class="info">

            <p>
                العدد المسموح:
                <strong>${allowed}</strong>
                أشخاص
            </p>

            <p>
                تم الدخول:
                <strong>${checkedIn}</strong>
                أشخاص
            </p>

            <p>
                المتبقي:
                <strong>${remaining}</strong>
                أشخاص
            </p>

        </div>

        <div class="remaining">
            يمكنك تسجيل دخول حتى
            ${remaining}
            ${remaining === 1 ? "شخص" : "أشخاص"}
        </div>

        <div class="buttons">

            ${createButton(1, remaining)}

            ${createButton(2, remaining)}

            ${createButton(3, remaining)}

            ${createButton(4, remaining)}

            ${createButton(5, remaining)}

            ${createButton(6, remaining)}

            ${createButton(7, remaining)}

            ${createButton(8, remaining)}

            ${createButton(9, remaining)}

            ${createButton(10, remaining)}

        </div>

    `;

}


/* =========================================
   إنشاء زر دخول
========================================= */

function createButton(
    number,
    remaining
) {

    const disabled =
        number > remaining
            ? "disabled"
            : "";


    return `

        <button
            ${disabled}
            onclick="checkIn(${number})">

            دخول ${number}

        </button>

    `;

}


/* =========================================
   تسجيل دخول الأشخاص
========================================= */

async function checkIn(number) {

    if (!invitation) {
        return;
    }


    /*
       إعادة قراءة الدعوة من قاعدة البيانات
       قبل التسجيل للتأكد أن العدد
       لم يتغير من جهاز آخر
    */

    const {
        data: latestInvitation,
        error: latestError
    } = await supabaseClient

        .from("invitations")

        .select("*")

        .eq("id", invitation.id)

        .single();


    if (
        latestError ||
        !latestInvitation
    ) {

        alert(
            "تعذر التحقق من حالة الدعوة ❌"
        );

        return;
    }


    invitation =
        {
            ...invitation,
            ...latestInvitation
        };


    const allowed =
        Number(
            invitation.guest_count || 0
        );


    const current =
        Number(
            invitation.checked_in || 0
        );


    const remaining =
        Math.max(
            allowed - current,
            0
        );


    /*
       التأكد أن العدد المطلوب
       لا يتجاوز المتبقي
    */

    if (
        number < 1 ||
        number > remaining
    ) {

        alert(
            `المتبقي لهذه الدعوة ${remaining} فقط.`
        );

        showDuringMessage();

        return;
    }


    const newCheckedIn =
        current + number;


    /*
       إذا وصل العدد للحد المسموح
       تصبح الدعوة مكتملة
    */

    const fullyUsed =
        newCheckedIn >= allowed;


    /*
       تحديث قاعدة البيانات
    */

    const {
        data,
        error
    } = await supabaseClient

        .from("invitations")

        .update({

            checked_in:
                newCheckedIn,

            used:
                fullyUsed

        })

        .eq(
            "id",
            invitation.id
        )

        /*
           مهم:
           نتأكد أن العدد القديم
           هو نفس العدد الذي قرأناه
        */

        .eq(
            "checked_in",
            current
        )

        .select()

        .single();


    if (error || !data) {

        console.error(error);

        alert(
            "تعذر تسجيل الدخول. ربما تم تسجيل دخول أشخاص من جهاز آخر."
        );

        /*
           إعادة قراءة الحالة
        */

        await loadInvitation();

        return;
    }


    /*
       تحديث البيانات الحالية
    */

    invitation.checked_in =
        data.checked_in;


    invitation.used =
        data.used;


    /*
       عرض الحالة الجديدة
    */

    showDuringMessage();


    /*
       رسالة نجاح
    */

    if (fullyUsed) {

        alert(
            `تم تسجيل دخول ${number} أشخاص ✅\n\nاكتمل العدد المسموح لهذه الدعوة.`
        );

    } else {

        const newRemaining =
            allowed -
            data.checked_in;


        alert(
            `تم تسجيل دخول ${number} أشخاص ✅\n\nالمتبقي: ${newRemaining}`
        );

    }

}


/* =========================================
   بعد انتهاء وقت الدخول
========================================= */

function showAfterMessage() {

    clearInterval(
        countdownTimer
    );


    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="message danger">
            انتهى وقت الدخول
        </div>

        <div class="sub-message">
            شكرًا لحضورك ومشاركتنا هذه المناسبة الجميلة 🤍
        </div>

    `;

}


/* =========================================
   رسالة الخطأ
========================================= */

function showError(message) {

    clearInterval(
        countdownTimer
    );


    document.getElementById(
        "content"
    ).innerHTML = `

        <p class="error">
            ${message}
        </p>

    `;

}


/* =========================================
   حماية النصوص
========================================= */

function escapeHtml(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================================
   تشغيل الصفحة
========================================= */

loadInvitation();

</script>

</body>

</html>
