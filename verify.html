```html
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>التحقق من الدعوة</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f7f3ef;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 430px;
            background: white;
            border-radius: 25px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0,0,0,0.08);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .guest-name {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .event-name {
            color: #777;
            margin-bottom: 25px;
        }

        .message {
            font-size: 22px;
            font-weight: bold;
            line-height: 1.8;
            margin: 20px 0 10px;
        }

        .sub-message {
            font-size: 17px;
            line-height: 1.8;
            color: #666;
        }

        .success {
            color: #287a4b;
        }

        .warning {
            color: #b06a00;
        }

        .danger {
            color: #c0392b;
        }

        .countdown {
            font-size: 30px;
            font-weight: bold;
            margin: 20px 0;
        }

        .info {
            background: #f7f7f7;
            border-radius: 15px;
            padding: 18px;
            margin: 25px 0;
        }

        .info p {
            margin: 8px 0;
            font-size: 17px;
        }

        .checkin-button {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 16px;
            font-size: 18px;
            cursor: pointer;
            background: #222;
            color: white;
            margin-top: 15px;
        }

        .checkin-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .error {
            color: #c0392b;
            font-weight: bold;
            font-size: 19px;
            line-height: 1.8;
        }

        .loading {
            color: #777;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>التحقق من الدعوة 🎟️</h1>

    <div id="content">
        <p class="loading">
            جاري التحقق من الدعوة...
        </p>
    </div>

</div>

<script>

let invitation = null;
let countdownTimer = null;


/* =========================
   تحميل الدعوة
========================= */

async function loadInvitation() {

    const params =
        new URLSearchParams(window.location.search);

    const code =
        params.get("code");

    if (!code) {

        showError(
            "عذرًا، هذا الكود غير صحيح<br>يرجى التحقق من الكود."
        );

        return;
    }

    const { data, error } =
        await supabaseClient

            .from("invitations")

            .select(`
                *,
                events (
                    event_name,
                    event_date,
                    start_time,
                    end_time
                )
            `)

            .eq("qr_code", code)

            .single();

    if (error || !data) {

        console.error(error);

        showError(
            "عذرًا، هذا الكود غير صحيح<br>يرجى التحقق من الكود."
        );

        return;
    }

    invitation = data;

    checkEventTime();
}


/* =========================
   التحقق من الوقت
========================= */

function checkEventTime() {

    if (!invitation || !invitation.events) {

        showError(
            "تعذر العثور على بيانات المناسبة."
        );

        return;
    }

    const event = invitation.events;

    const start =
        new Date(
            `${event.event_date}T${event.start_time}`
        );

    const end =
        new Date(
            `${event.event_date}T${event.end_time}`
        );

    const now = new Date();


    /* قبل الدخول */

    if (now < start) {

        showBeforeMessage(start);

        return;
    }


    /* بعد انتهاء الدخول */

    if (now >= end) {

        showAfterMessage();

        return;
    }


    /* وقت الدخول */

    showDuringMessage();
}


/* =========================
   قبل وقت الدخول
========================= */

function showBeforeMessage(start) {

    clearInterval(countdownTimer);

    document.getElementById("content").innerHTML = `

        <div class="message warning">
            أهلًا بك 🤍
        </div>

        <div class="sub-message">
            موعدنا لم يحن بعد، ننتظرك في الوقت المحدد
        </div>

        <div
            id="countdown"
            class="countdown warning">
        </div>
    `;

    updateCountdown(start);

    countdownTimer =
        setInterval(() => {

            updateCountdown(start);

        }, 1000);
}


/* =========================
   العداد
========================= */

function updateCountdown(start) {

    const countdown =
        document.getElementById("countdown");

    if (!countdown) return;

    const now = new Date();

    const difference =
        start - now;

    if (difference <= 0) {

        clearInterval(countdownTimer);

        checkEventTime();

        return;
    }

    const hours =
        Math.floor(
            difference /
            (1000 * 60 * 60)
        );

    const minutes =
        Math.floor(
            (difference %
            (1000 * 60 * 60)) /
            (1000 * 60)
        );

    const seconds =
        Math.floor(
            (difference %
            (1000 * 60)) /
            1000
        );

    countdown.innerHTML =
        `${hours} ساعة ${minutes} دقيقة ${seconds} ثانية`;
}


/* =========================
   أثناء وقت الدخول
========================= */

function showDuringMessage() {

    clearInterval(countdownTimer);

    const allowed =
        Number(invitation.guest_count || 0);

    const checkedIn =
        Number(invitation.checked_in || 0);

    const remaining =
        Math.max(
            allowed - checkedIn,
            0
        );


    /* إذا اكتمل العدد */

    if (remaining <= 0) {

        document.getElementById("content").innerHTML = `

            <div class="message danger">
                اكتمل عدد الدخول
            </div>

            <div class="sub-message">
                تم تسجيل دخول جميع الأشخاص المسموح لهم بهذه الدعوة.
                <br>
                لا يمكن استخدام الرمز مرة أخرى.
            </div>
        `;

        return;
    }


    const guestName =
        invitation.guest_name &&
        invitation.guest_name !== "مدعو"

            ? invitation.guest_name

            : "مدعو";


    const eventName =
        invitation.events.event_name || "";


    document.getElementById("content").innerHTML = `

        <div class="guest-name">
            ${escapeHtml(guestName)}
        </div>

        <div class="event-name">
            ${escapeHtml(eventName)}
        </div>

        <div class="message success">
            يا هلا ومرحبًا 🤍
        </div>

        <div class="sub-message">
            الدعوة صحيحة ويمكن تسجيل الدخول
        </div>

        <div class="info">

            <p>
                العدد المسموح:
                <strong>${allowed}</strong>
                أشخاص
            </p>

            <p>
                تم الدخول:
                <strong>${checkedIn}</strong>
                أشخاص
            </p>

            <p>
                المتبقي:
                <strong>${remaining}</strong>
                أشخاص
            </p>

        </div>

        <button
            id="checkInButton"
            class="checkin-button"
            onclick="checkIn()">

            تسجيل دخول شخص واحد
        </button>
    `;
}


/* =========================
   تسجيل دخول شخص واحد
========================= */

async function checkIn() {

    if (!invitation) return;


    const button =
        document.getElementById(
            "checkInButton"
        );


    if (button) {

        button.disabled = true;

        button.innerText =
            "جاري تسجيل الدخول...";
    }


    try {

        const allowed =
            Number(
                invitation.guest_count || 0
            );

        const current =
            Number(
                invitation.checked_in || 0
            );


        /* حماية من تجاوز العدد */

        if (current >= allowed) {

            showDuringMessage();

            return;
        }


        const newCheckedIn =
            current + 1;


        const fullyUsed =
            newCheckedIn >= allowed;


        /*
           التحديث لا يتم إلا إذا كان
           checked_in ما زال بنفس الرقم.

           هذا يمنع تجاوز العدد عند
           وجود محاولتين في نفس الوقت.
        */

        const { data, error } =
            await supabaseClient

                .from("invitations")

                .update({

                    checked_in:
                        newCheckedIn,

                    used:
                        fullyUsed

                })

                .eq("id", invitation.id)

                .eq("checked_in", current)

                .select()

                .single();


        if (error || !data) {

            console.error(error);

            alert(
                "تعذر تسجيل الدخول. ربما تم تسجيل شخص آخر في نفس اللحظة."
            );

            await reloadInvitation();

            return;
        }


        invitation =
            {
                ...invitation,
                ...data
            };


        alert(
            "تم تسجيل دخول شخص واحد ✅"
        );


        showDuringMessage();


    } catch (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء تسجيل الدخول ❌"
        );

        if (button) {

            button.disabled = false;

            button.innerText =
                "تسجيل دخول شخص واحد";
        }
    }
}


/* =========================
   إعادة تحميل الدعوة
========================= */

async function reloadInvitation() {

    const code =
        new URLSearchParams(
            window.location.search
        ).get("code");

    if (!code) return;


    const { data, error } =
        await supabaseClient

            .from("invitations")

            .select(`
                *,
                events (
                    event_name,
                    event_date,
                    start_time,
                    end_time
                )
            `)

            .eq("qr_code", code)

            .single();


    if (!error && data) {

        invitation = data;

        showDuringMessage();
    }
}


/* =========================
   بعد انتهاء الوقت
========================= */

function showAfterMessage() {

    clearInterval(countdownTimer);

    document.getElementById("content").innerHTML = `

        <div class="message danger">
            انتهى وقت الدخول
        </div>

        <div class="sub-message">
            شكرًا لحضورك ومشاركتنا هذه المناسبة الجميلة 🤍
        </div>
    `;
}


/* =========================
   رسالة الخطأ
========================= */

function showError(message) {

    clearInterval(countdownTimer);

    document.getElementById("content").innerHTML = `

        <p class="error">
            ${message}
        </p>
    `;
}


/* =========================
   حماية النص
========================= */

function escapeHtml(text) {

    return String(text)

        .replaceAll("&", "&amp;")

        .replaceAll("<", "&lt;")

        .replaceAll(">", "&gt;")

        .replaceAll('"', "&quot;")

        .replaceAll("'", "&#039;");
}


/* =========================
   تشغيل الصفحة
========================= */

loadInvitation();

</script>

</body>

</html>
