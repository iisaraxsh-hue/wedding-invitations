<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>دعوتك الخاصة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(135deg, #f8f3ed, #eee5dc);

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 20px;

}

.invitation {

    width: 100%;

    max-width: 390px;

    background: #ffffff;

    border-radius: 30px;

    padding: 35px 25px;

    text-align: center;

    box-shadow:
        0 18px 45px rgba(0,0,0,0.10);

}

.top-icon {

    width: 70px;

    height: 70px;

    margin: 0 auto 18px;

    border-radius: 50%;

    background: #f3eee8;

    display: flex;

    justify-content: center;

    align-items: center;

    font-size: 34px;

}

h1 {

    margin: 0;

    color: #292929;

    font-size: 25px;

}

.subtitle {

    margin-top: 8px;

    color: #888;

    font-size: 14px;

}

.guest {

    margin: 25px 0 8px;

    font-size: 27px;

    font-weight: bold;

    color: #222;

}

.count {

    color: #666;

    font-size: 16px;

    margin-bottom: 22px;

}

.qr-box {

    background: #fafafa;

    border-radius: 22px;

    padding: 18px;

    display: inline-block;

}

#qrcode {

    display: flex;

    justify-content: center;

}

#qrcode img {

    display: block;

    border-radius: 8px;

}

.message {

    margin-top: 22px;

    color: #777;

    font-size: 14px;

    line-height: 1.7;

}

.footer {

    margin-top: 20px;

    padding-top: 15px;

    border-top: 1px solid #eee;

    color: #aaa;

    font-size: 12px;

}

</style>

</head>

<body>

<div class="invitation">

    <div class="top-icon">
        💌
    </div>

    <h1>
        دعوتك الخاصة
    </h1>

    <div class="subtitle">
        يسعدنا حضورك ومشاركتنا مناسبتنا ✨
    </div>

    <div id="guestName" class="guest"></div>

    <div id="guestCount" class="count"></div>

    <div class="qr-box">

        <div id="qrcode"></div>

    </div>

    <div class="message">
        يرجى إبراز رمز QR عند الدخول
        <br>
        رمز الدعوة خاص بك ولا يمكن استخدامه أكثر من مرة
    </div>

    <div class="footer">
        نتطلع لرؤيتك 🤍
    </div>

</div>


<script>

async function loadInvitation() {

    const params =
        new URLSearchParams(window.location.search);

    const code =
        params.get("code");


    if (!code) {

        document.getElementById("guestName").innerText =
            "الدعوة غير موجودة";

        return;
    }


    const { data: invitation, error } =
        await supabaseClient

            .from("invitations")

            .select("*")

            .eq("qr_code", code)

            .single();


    if (error || !invitation) {

        console.error(error);

        document.getElementById("guestName").innerText =
            "الدعوة غير صالحة ❌";

        return;
    }


    document.getElementById("guestName").innerText =
        invitation.guest_name || "ضيفنا الكريم";


    document.getElementById("guestCount").innerText =
        `عدد الأشخاص: ${invitation.guest_count}`;


    /*
       رابط التحقق عند مسح QR
       تم تغييره من Netlify إلى GitHub Pages
    */

    const verifyURL =
        `https://iisaraxsh-hue.github.io/wedding-invitations/verify.html?code=${encodeURIComponent(code)}`;


    new QRCode(

        document.getElementById("qrcode"),

        {

            text: verifyURL,

            width: 220,

            height: 220

        }

    );

}


loadInvitation();

</script>

</body>

</html>
