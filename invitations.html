<body>


<div class="container">

<div class="box">


<h1>
إدارة الدعوات
</h1>

<div class="subtitle">
أضيفي أسماء المدعوين وعدد المرافقين لكل دعوة
</div>


<div id="eventInfo"
     class="event-info">

    جاري تحميل بيانات الحفل...

</div>


<!-- =========================
     إضافة مدعو
========================= -->

<div class="add-box">

<h3>
إضافة مدعو
</h3>


<label>
اسم المدعو
</label>

<input
    id="guestName"
    type="text"
    placeholder="مثال: نورة محمد"
>


<label>
عدد المرافقين
</label>

<input
    id="companionCount"
    type="number"
    min="0"
    max="3"
    step="1"
    value="0"
    placeholder="0"
>


<div class="message">
يمكن إضافة من 0 إلى 3 مرافقين.
<br>
إذا كانت الدعوة للمدعو فقط اتركي العدد 0.
</div>


<button
    id="addButton"
    type="button"
    onclick="addInvitation()">

    إضافة الدعوة

</button>


<div id="message"></div>

</div>


<!-- =========================
     قائمة الدعوات
========================= -->

<div
    id="invitationsList"
    style="margin-top:30px;">

    <div class="loading">
        جاري تحميل الدعوات...
    </div>

</div>


<!-- =========================
     الانتقال للتصميم
========================= -->

<button
    id="designButton"
    class="next-button"
    type="button"
    onclick="goToDesign()">

    الانتقال إلى تصميم الدعوات

</button>


</div>

</div>


<script>


/* =========================
   متغيرات
========================= */

let eventId = null;

let eventData = null;

let invitations = [];


/* =========================
   قراءة event_id
========================= */

const params =
    new URLSearchParams(
        window.location.search
    );

eventId =
    params.get("event_id");


/* =========================
   التحقق
========================= */

if (!eventId) {

    document.getElementById(
        "eventInfo"
    ).innerHTML = `

        <div class="error">
            لم يتم العثور على الحفل.
        </div>

    `;

}


/* =========================
   تحميل الحفل
========================= */

async function loadEvent() {

    if (!eventId) return;


    const {
        data,
        error
    } =
        await supabaseClient

        .from("events")

        .select("*")

        .eq("id", eventId)

        .single();


    if (error || !data) {

        console.error(error);

        document.getElementById(
            "eventInfo"
        ).innerHTML = `

            <div class="error">
                تعذر تحميل بيانات الحفل.
            </div>

        `;

        return;
    }


    eventData = data;


    document.getElementById(
        "eventInfo"
    ).innerHTML = `

        <strong>
            ${escapeHtml(data.event_name)}
        </strong>

        <br>

        التاريخ:
        ${escapeHtml(data.event_date)}

        <br>

        وقت الدخول:
        ${escapeHtml(data.start_time)}
        -
        ${escapeHtml(data.end_time)}

    `;


    loadInvitations();

}


/* =========================
   تحميل الدعوات
========================= */

async function loadInvitations() {

    const {
        data,
        error
    } =
        await supabaseClient

        .from("invitations")

        .select("*")

        .eq("event_id", eventId)

        .order(
            "invitation_number",
            {
                ascending: true
            }
        );


    if (error) {

        console.error(error);

        document.getElementById(
            "invitationsList"
        ).innerHTML = `

            <div class="error">
                تعذر تحميل الدعوات.
            </div>

        `;

        return;
    }


    invitations = data || [];


    renderInvitations();

}


/* =========================
   عرض الدعوات
========================= */

function renderInvitations() {

    const list =
        document.getElementById(
            "invitationsList"
        );


    if (!invitations.length) {

        list.innerHTML = `

            <div class="empty">
                لم تتم إضافة أسماء بعد.
            </div>

        `;

        return;
    }


    list.innerHTML = `

        <h3>
            الدعوات
            (${invitations.length})
        </h3>

        ${invitations
            .map(
                invitation =>
                    renderInvitation(invitation)
            )
            .join("")
        }

    `;

}


/* =========================
   بطاقة الدعوة
========================= */

function renderInvitation(invitation) {

    const guestName =
        invitation.guest_name ||
        "بدون اسم";


    const companionCount =
        Math.max(
            Number(
                invitation.guest_count || 1
            ) - 1,
            0
        );


    const totalAllowed =
        Number(
            invitation.guest_count || 1
        );


    const checkedIn =
        Number(
            invitation.checked_in || 0
        );


    return `

        <div
            class="invitation"
            id="invitation-${invitation.id}">

            <div class="invitation-name">

                ${escapeHtml(guestName)}

            </div>


            <div class="invitation-info">

                المرافقون:
                ${companionCount}

                <br>

                إجمالي الأشخاص المسموح:
                ${totalAllowed}

                <br>

                تم الدخول:
                ${checkedIn}

            </div>


            <div class="invitation-actions">

                <button
                    class="small-button save-button"
                    onclick="editInvitation('${invitation.id}')">

                    تعديل

                </button>


                <button
                    class="small-button delete-button"
                    onclick="deleteInvitation('${invitation.id}')">

                    حذف

                </button>

            </div>

        </div>

    `;

}


/* =========================
   إضافة دعوة
========================= */

async function addInvitation() {

    const nameInput =
        document.getElementById(
            "guestName"
        );


    const companionInput =
        document.getElementById(
            "companionCount"
        );


    const name =
        nameInput.value.trim();


    const companions =
        Number(
            companionInput.value
        );


    if (!name) {

        showMessage(
            "فضلاً اكتبي اسم المدعو.",
            "error"
        );

        return;
    }


    if (
        !Number.isInteger(companions) ||
        companions < 0 ||
        companions > 3
    ) {

        showMessage(
            "عدد المرافقين يجب أن يكون من 0 إلى 3.",
            "error"
        );

        return;
    }


    const button =
        document.getElementById(
            "addButton"
        );


    button.disabled = true;

    button.innerText =
        "جاري الإضافة...";


    try {


        /* =========================
           رقم داخلي فقط
           لا يظهر للضيف
        ========================= */

        const nextNumber =
            invitations.length
                ? Math.max(
                    ...invitations.map(
                        item =>
                            Number(
                                item.invitation_number || 0
                            )
                    )
                ) + 1
                : 1;


        /* =========================
           إجمالي الأشخاص
           المدعو + المرافقين
        ========================= */

        const totalAllowed =
            1 + companions;


        const {
            data,
            error
        } =
            await supabaseClient

            .from("invitations")

            .insert({

                event_id:
                    eventId,

                guest_name:
                    name,

                invitation_number:
                    nextNumber,

                guest_count:
                    totalAllowed,

                checked_in:
                    0,

                qr_code:
                    crypto.randomUUID(),

                used:
                    false

            })

            .select()

            .single();


        if (error) {

            console.error(error);

            showMessage(
                "حدث خطأ أثناء إضافة الدعوة.",
                "error"
            );

            return;
        }


        invitations.push(data);


        nameInput.value = "";

        companionInput.value = "0";


        renderInvitations();


        showMessage(
            "تمت إضافة الدعوة بنجاح 🤍",
            "success"
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "حدث خطأ غير متوقع.",
            "error"
        );

    } finally {

        button.disabled = false;

        button.innerText =
            "إضافة الدعوة";

    }

}


/* =========================
   تعديل الدعوة
========================= */

async function editInvitation(id) {

    const invitation =
        invitations.find(
            item =>
                item.id === id
        );


    if (!invitation) return;


    const currentName =
        invitation.guest_name || "";


    const currentCompanions =
        Math.max(
            Number(
                invitation.guest_count || 1
            ) - 1,
            0
        );


    const newName =
        prompt(
            "اسم المدعو:",
            currentName
        );


    if (newName === null) return;


    const cleanName =
        newName.trim();


    if (!cleanName) {

        alert(
            "اسم المدعو لا يمكن أن يكون فارغًا."
        );

        return;
    }


    const newCompanions =
        prompt(
            "عدد المرافقين (من 0 إلى 3):",
            currentCompanions
        );


    if (newCompanions === null) return;


    const companions =
        Number(
            newCompanions
        );


    if (
        !Number.isInteger(companions) ||
        companions < 0 ||
        companions > 3
    ) {

        alert(
            "عدد المرافقين يجب أن يكون من 0 إلى 3."
        );

        return;
    }


    const totalAllowed =
        1 + companions;


    const {
        data,
        error
    } =
        await supabaseClient

        .from("invitations")

        .update({

            guest_name:
                cleanName,

            guest_count:
                totalAllowed

        })

        .eq("id", id)

        .select()

        .single();


    if (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء تعديل الدعوة."
        );

        return;
    }


    invitations =
        invitations.map(
            item =>
                item.id === id
                    ? data
                    : item
        );


    renderInvitations();


    showMessage(
        "تم تعديل الدعوة بنجاح 🤍",
        "success"
    );

}


/* =========================
   حذف الدعوة
========================= */

async function deleteInvitation(id) {

    const invitation =
        invitations.find(
            item =>
                item.id === id
        );


    if (!invitation) return;


    const name =
        invitation.guest_name ||
        "هذه الدعوة";


    const confirmed =
        confirm(
            `هل أنتِ متأكدة من حذف دعوة "${name}"؟`
        );


    if (!confirmed) return;


    const {
        error
    } =
        await supabaseClient

        .from("invitations")

        .delete()

        .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "حدث خطأ أثناء حذف الدعوة."
        );

        return;
    }


    invitations =
        invitations.filter(
            item =>
                item.id !== id
        );


    renderInvitations();


    showMessage(
        "تم حذف الدعوة.",
        "success"
    );

}


/* =========================
   الانتقال للتصميم
========================= */

function goToDesign() {

    if (!eventId) {

        alert(
            "لم يتم العثور على الحفل."
        );

        return;
    }


    if (!invitations.length) {

        alert(
            "أضيفي دعوة واحدة على الأقل قبل الانتقال للتصميم."
        );

        return;
    }


    window.location.href =
        `design.html?event_id=${encodeURIComponent(eventId)}`;

}


/* =========================
   الرسائل
========================= */

function showMessage(
    message,
    type
) {

    const element =
        document.getElementById(
            "message"
        );


    element.className =
        `message ${type}`;


    element.innerHTML =
        message;


    setTimeout(() => {

        element.innerHTML = "";

        element.className =
            "message";

    }, 3000);

}


/* =========================
   حماية النص
========================= */

function escapeHtml(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   تشغيل الصفحة
========================= */

loadEvent();

</script>

</body>

</html>
