<script>


let currentEventId = null;


/* =====================================================
   فتح وإغلاق نافذة رفع الملف
===================================================== */

function openUploadModal() {

    document
        .getElementById("uploadModal")
        .classList.add("show");

}


function closeUploadModal() {

    document
        .getElementById("uploadModal")
        .classList.remove("show");

    document
        .getElementById("guestFile")
        .value = "";

    document
        .getElementById("selectedFile")
        .innerText = "";

}


function showSelectedFile() {

    const file =
        document
            .getElementById("guestFile")
            .files[0];


    document
        .getElementById("selectedFile")
        .innerText =
            file
                ? `تم اختيار: ${file.name}`
                : "";

}


/* =====================================================
   تنظيف النص
===================================================== */

function normalizeText(value) {

    return String(value ?? "")

        .replace(/\uFEFF/g, "")

        .replace(/[\u200B-\u200D\u2060]/g, "")

        .replace(/[ًٌٍَُِّْـ]/g, "")

        .replace(/[أإآ]/g, "ا")

        .replace(/ة/g, "ه")

        .replace(/ى/g, "ي")

        .replace(/ؤ/g, "و")

        .replace(/ئ/g, "ي")

        .replace(/\s+/g, " ")

        .trim()

        .toLowerCase();

}


/* =====================================================
   البحث عن عمود الاسم
===================================================== */

function isNameHeader(value) {

    const text =
        normalizeText(value);


    if (!text) {

        return false;

    }


    const names = [

        "اسم المدعو",
        "اسم المدعوه",
        "اسم الضيف",
        "اسم الضيفه",
        "اسم",
        "الاسم",
        "المدعو",
        "المدعوه",
        "الضيف",
        "الضيفه",
        "guest name",
        "guest_name",
        "guest",
        "name"

    ];


    return names.some(
        name => {

            const normalizedName =
                normalizeText(name);

            return (
                text === normalizedName ||
                text.includes(normalizedName) ||
                normalizedName.includes(text)
            );

        }
    );

}


/* =====================================================
   البحث عن عمود المرافقين
===================================================== */

function isCompanionHeader(value) {

    const text =
        normalizeText(value);


    if (!text) {

        return false;

    }


    const names = [

        "عدد المرافقين",
        "عدد مرافقين",
        "المرافقين",
        "مرافقين",
        "المرافق",
        "مرافق",
        "عدد المرافق",
        "companions",
        "companion",
        "companion count",
        "companion_count"

    ];


    return names.some(
        name => {

            const normalizedName =
                normalizeText(name);

            return (
                text === normalizedName ||
                text.includes(normalizedName) ||
                normalizedName.includes(text)
            );

        }
    );

}


/* =====================================================
   العثور على صف العناوين
===================================================== */

function findHeaderRow(matrix) {

    for (
        let rowIndex = 0;
        rowIndex < Math.min(matrix.length, 30);
        rowIndex++
    ) {

        const row =
            matrix[rowIndex] || [];


        let hasName =
            false;

        let hasCompanion =
            false;


        for (
            let colIndex = 0;
            colIndex < row.length;
            colIndex++
        ) {

            const value =
                row[colIndex];


            if (isNameHeader(value)) {

                hasName = true;

            }


            if (isCompanionHeader(value)) {

                hasCompanion = true;

            }

        }


        if (
            hasName ||
            hasCompanion
        ) {

            return rowIndex;

        }

    }


    return -1;

}


/* =====================================================
   إيجاد أرقام الأعمدة
===================================================== */

function findColumnIndexes(headerRow) {

    let nameIndex = -1;

    let companionIndex = -1;


    for (
        let i = 0;
        i < headerRow.length;
        i++
    ) {

        if (
            nameIndex === -1 &&
            isNameHeader(headerRow[i])
        ) {

            nameIndex = i;

        }


        if (
            companionIndex === -1 &&
            isCompanionHeader(headerRow[i])
        ) {

            companionIndex = i;

        }

    }


    return {

        nameIndex,
        companionIndex

    };

}


/* =====================================================
   تحويل الملف إلى جدول
===================================================== */

async function readGuestFile(file) {

    const data =
        await file.arrayBuffer();


    const workbook =
        XLSX.read(
            data,
            {
                type: "array",
                cellDates: false,
                raw: false
            }
        );


    if (
        !workbook.SheetNames ||
        workbook.SheetNames.length === 0
    ) {

        throw new Error(
            "لم يتم العثور على ورقة داخل الملف."
        );

    }


    /*
       نستخدم أول ورقة
    */

    const sheet =
        workbook.Sheets[
            workbook.SheetNames[0]
        ];


    /*
       نحول الورقة إلى مصفوفة
       بدل sheet_to_json مباشرة.

       هذه النقطة مهمة جدًا لأنها
       تسمح لنا بالبحث عن العناوين
       حتى لو كانت ليست في الصف الأول.
    */

    const matrix =
        XLSX.utils.sheet_to_json(
            sheet,
            {
                header: 1,
                defval: "",
                raw: false
            }
        );


    return matrix;

}


/* =====================================================
   استيراد المدعوين
===================================================== */

async function importGuests() {

    const fileInput =
        document.getElementById(
            "guestFile"
        );


    const file =
        fileInput.files[0];


    if (!file) {

        alert(
            "فضلاً اختاري ملف الجدول أولاً"
        );

        return;

    }


    if (!currentEventId) {

        alert(
            "لم يتم العثور على رقم الحفل"
        );

        return;

    }


    try {


        /* قراءة الملف */

        const matrix =
            await readGuestFile(file);


        if (
            !matrix ||
            matrix.length === 0
        ) {

            alert(
                "الجدول فارغ ❌"
            );

            return;

        }


        /* البحث عن صف العناوين */

        const headerRowIndex =
            findHeaderRow(matrix);


        if (
            headerRowIndex === -1
        ) {

            /*
               عرض أول صفوف الملف
               للمساعدة في اكتشاف المشكلة.
            */

            const preview =
                matrix
                    .slice(0, 10)
                    .map(row =>
                        row
                            .filter(value =>
                                String(value)
                                    .trim() !== ""
                            )
                            .join(" | ")
                    )
                    .filter(Boolean)
                    .join("\n");


            alert(
                "لم أجد عناوين الأعمدة.\n\n" +
                "تأكدي أن الجدول يحتوي على:\n" +
                "اسم المدعو\n" +
                "عدد المرافقين\n\n" +
                "البيانات التي قرأها النظام:\n" +
                (preview || "لا توجد بيانات مقروءة")
            );

            return;

        }


        /* تحديد الأعمدة */

        const headerRow =
            matrix[headerRowIndex];


        const {
            nameIndex,
            companionIndex
        } =
            findColumnIndexes(
                headerRow
            );


        if (
            nameIndex === -1
        ) {

            alert(
                "لم أجد عمود اسم المدعو ❌"
            );

            return;

        }


        /*
           إذا لم يوجد عمود المرافقين
           نعتبر جميع الدعوات = 0 مرافق.
        */

        const hasCompanionColumn =
            companionIndex !== -1;


        /* استخراج الصفوف */

        const guestRows = [];


        for (
            let i = headerRowIndex + 1;
            i < matrix.length;
            i++
        ) {

            const row =
                matrix[i] || [];


            const name =
                String(
                    row[nameIndex] ?? ""
                ).trim();


            /*
               تجاهل الصفوف الفارغة
            */

            if (!name) {

                continue;

            }


            let companions = 0;


            if (
                hasCompanionColumn
            ) {

                const rawValue =
                    row[companionIndex];


                /*
                   الفراغ = 0
                */

                if (
                    rawValue !== "" &&
                    rawValue !== null &&
                    rawValue !== undefined
                ) {

                    companions =
                        Number(
                            String(rawValue)
                                .replace(/[^\d-]/g, "")
                        );

                }

            }


            if (
                !Number.isInteger(
                    companions
                ) ||
                companions < 0
            ) {

                alert(
                    `عدد المرافقين غير صحيح عند الصف رقم ${i + 1}`
                );

                return;

            }


            guestRows.push({

                name,
                companions

            });

        }


        if (
            guestRows.length === 0
        ) {

            alert(
                "لم يتم العثور على أسماء مدعوين في الجدول ❌"
            );

            return;

        }


        /* تحميل الدعوات */

        const {
            data: invitations,
            error: invitationError
        } =
            await supabaseClient

                .from("invitations")

                .select("*")

                .eq(
                    "event_id",
                    currentEventId
                )

                .order(
                    "invitation_number",
                    {
                        ascending: true
                    }
                );


        if (
            invitationError
        ) {

            console.error(
                invitationError
            );

            alert(
                "حدث خطأ أثناء تحميل الدعوات ❌"
            );

            return;

        }


        if (
            !invitations ||
            invitations.length === 0
        ) {

            alert(
                "لا توجد دعوات لهذا الحفل."
            );

            return;

        }


        if (
            guestRows.length >
            invitations.length
        ) {

            alert(

                `عدد الأسماء في الجدول (${guestRows.length}) أكبر من عدد الدعوات الموجودة (${invitations.length}).`

            );

            return;

        }


        /* تأكيد */

        const confirmed =
            confirm(

                `تم العثور على ${guestRows.length} مدعو.\n\n` +

                `سيتم ربط الأسماء بأول ${guestRows.length} دعوة حسب الترتيب.\n\n` +

                `هل تريدين المتابعة؟`

            );


        if (!confirmed) {

            return;

        }


        let updated = 0;


        /* تحديث الدعوات */

        for (
            let i = 0;
            i < guestRows.length;
            i++
        ) {

            const guest =
                guestRows[i];


            const invitation =
                invitations[i];


            const totalPeople =
                1 +
                guest.companions;


            const {
                error: updateError
            } =
                await supabaseClient

                    .from("invitations")

                    .update({

                        guest_name:
                            guest.name,

                        guest_count:
                            totalPeople

                    })

                    .eq(
                        "id",
                        invitation.id
                    );


            if (
                updateError
            ) {

                console.error(
                    updateError
                );

                alert(

                    `حدث خطأ عند تحديث الدعوة رقم ${invitation.invitation_number}`

                );

                return;

            }


            updated++;

        }


        closeUploadModal();


        alert(

            `تم استيراد ${updated} مدعو بنجاح ✅`

        );


        loadInvitations();

    }

    catch (error) {

        console.error(
            error
        );

        alert(

            "تعذر قراءة الملف ❌\n\n" +

            "تأكدي أن الملف Excel أو CSV صالح."

        );

    }

}


/* =====================================================
   إضافة دعوة يدويًا
===================================================== */

function openAddGuest() {

    document
        .getElementById("addModal")
        .classList.add("show");

}


function closeAddGuest() {

    document
        .getElementById("addModal")
        .classList.remove("show");

    document
        .getElementById("guestNameInput")
        .value = "";

    document
        .getElementById("guestCountInput")
        .value = "0";

}


async function addGuest() {

    const name =
        document
            .getElementById(
                "guestNameInput"
            )
            .value
            .trim();


    const companions =
        Number(
            document
                .getElementById(
                    "guestCountInput"
                )
                .value
        );


    if (
        !Number.isInteger(
            companions
        ) ||
        companions < 0
    ) {

        alert(
            "عدد المرافقين يجب أن يكون 0 أو أكثر"
        );

        return;

    }


    const {
        data: existingInvitations,
        error: countError
    } =
        await supabaseClient

            .from("invitations")

            .select(
                "invitation_number"
            )

            .eq(
                "event_id",
                currentEventId
            );


    if (
        countError
    ) {

        console.error(
            countError
        );

        alert(
            "حدث خطأ أثناء إنشاء الدعوة"
        );

        return;

    }


    let nextNumber = 1;


    if (
        existingInvitations &&
        existingInvitations.length > 0
    ) {

        const numbers =
            existingInvitations

                .map(
                    item =>
                        Number(
                            item.invitation_number
                        )
                )

                .filter(
                    number =>
                        Number.isFinite(
                            number
                        )
                );


        if (
            numbers.length > 0
        ) {

            nextNumber =
                Math.max(
                    ...numbers
                ) + 1;

        }

    }


    const qrCode =
        crypto.randomUUID();


    const {
        error
    } =
        await supabaseClient

            .from("invitations")

            .insert({

                event_id:
                    currentEventId,

                invitation_number:
                    nextNumber,

                guest_name:
                    name || null,

                guest_count:
                    1 + companions,

                checked_in:
                    0,

                qr_code:
                    qrCode,

                used:
                    false

            });


    if (
        error
    ) {

        console.error(
            error
        );

        alert(
            "حدث خطأ أثناء إضافة الدعوة ❌"
        );

        return;

    }


    alert(
        "تمت إضافة الدعوة بنجاح ✅"
    );


    closeAddGuest();

    loadInvitations();

}


/* =====================================================
   تحميل الدعوات
===================================================== */

async function loadInvitations() {

    const params =
        new URLSearchParams(
            window.location.search
        );


    currentEventId =
        params.get(
            "event_id"
        );


    if (
        !currentEventId
    ) {

        document
            .getElementById(
                "message"
            )
            .innerText =
                "رقم الحفل غير موجود";

        return;

    }


    const {
        data: invitations,
        error
    } =
        await supabaseClient

            .from("invitations")

            .select("*")

            .eq(
                "event_id",
                currentEventId
            )

            .order(
                "invitation_number",
                {
                    ascending: true
                }
            );


    if (
        error
    ) {

        console.error(
            error
        );

        document
            .getElementById(
                "message"
            )
            .innerText =
                "حدث خطأ أثناء تحميل الدعوات ❌";

        return;

    }


    document
        .getElementById(
            "message"
        )
        .innerText =
            `عدد الدعوات: ${invitations.length}`;


    const container =
        document
            .getElementById(
                "invitations"
            );


    container.innerHTML = "";


    invitations.forEach(
        invitation => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const guestName =
                invitation.guest_name ||
                "بدون اسم";


            const totalPeople =
                Number(
                    invitation.guest_count
                ) || 1;


            const companions =
                Math.max(
                    0,
                    totalPeople - 1
                );


            card.innerHTML = `

                <h2>
                    ${escapeHtml(
                        guestName
                    )}
                </h2>

                <p>
                    رقم الدعوة:
                    ${invitation.invitation_number}
                </p>

                <p>
                    المدعو الأساسي:
                    1
                </p>

                <p>
                    عدد المرافقين:
                    ${companions}
                </p>

                <p>
                    إجمالي المسموح:
                    ${totalPeople}
                </p>

                <p class="${
                    invitation.used
                        ? "used"
                        : "unused"
                }">

                    ${
                        invitation.used
                            ? "مستخدمة ❌"
                            : "غير مستخدمة ✅"
                    }

                </p>

                <div
                    class="buttons">

                    <button
                        class="edit-button"
                        onclick="editGuestName(
                            '${invitation.id}',
                            '${escapeJs(
                                invitation.guest_name || ""
                            )}'
                        )">

                        تعديل اسم المدعو

                    </button>


                    <button
                        class="edit-button"
                        onclick="editCompanions(
                            '${invitation.id}',
                            ${companions}
                        )">

                        تعديل عدد المرافقين

                    </button>

                </div>

            `;


            const qr =
                document.createElement(
                    "div"
                );


            qr.className =
                "qr";


            new QRCode(
                qr,
                {

                    text:
                        `${window.location.origin}/verify.html?code=${encodeURIComponent(
                            invitation.qr_code
                        )}`,

                    width:
                        180,

                    height:
                        180

                }
            );


            card.appendChild(
                qr
            );


            const openButton =
                document.createElement(
                    "a"
                );


            openButton.className =
                "open-button";


            openButton.innerText =
                "فتح الدعوة";


            openButton.href =
                `invitation.html?code=${encodeURIComponent(
                    invitation.qr_code
                )}`;


            card.appendChild(
                openButton
            );


            container.appendChild(
                card
            );

        }
    );

}


/* =====================================================
   تعديل الاسم
===================================================== */

async function editGuestName(
    id,
    currentName
) {

    const newName =
        prompt(
            "اكتبي اسم المدعو:",
            currentName
        );


    if (
        newName === null
    ) {

        return;

    }


    const name =
        newName.trim();


    const {
        error
    } =
        await supabaseClient

            .from("invitations")

            .update({

                guest_name:
                    name || null

            })

            .eq(
                "id",
                id
            );


    if (
        error
    ) {

        console.error(
            error
        );

        alert(
            "حدث خطأ أثناء تعديل الاسم"
        );

        return;

    }


    loadInvitations();

}


/* =====================================================
   تعديل المرافقين
===================================================== */

async function editCompanions(
    id,
    currentCompanions
) {

    const newValue =
        prompt(
            "اكتبي عدد المرافقين:",
            currentCompanions
        );


    if (
        newValue === null
    ) {

        return;

    }


    const companions =
        Number(
            newValue
        );


    if (
        !Number.isInteger(
            companions
        ) ||
        companions < 0
    ) {

        alert(
            "اكتبي عددًا صحيحًا 0 أو أكثر"
        );

        return;

    }


    const {
        error
    } =
        await supabaseClient

            .from("invitations")

            .update({

                guest_count:
                    1 + companions

            })

            .eq(
                "id",
                id
            );


    if (
        error
    ) {

        console.error(
            error
        );

        alert(
            "حدث خطأ أثناء تعديل عدد المرافقين"
        );

        return;

    }


    loadInvitations();

}


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHtml(text) {

    return String(text)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


function escapeJs(text) {

    return String(text)

        .replaceAll(
            "\\",
            "\\\\"
        )

        .replaceAll(
            "'",
            "\\'"
        )

        .replaceAll(
            "\n",
            "\\n"
        )

        .replaceAll(
            "\r",
            "\\r"
        );

}
